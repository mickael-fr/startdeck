<head>

<title>StartDeck</title>
<meta name="startdeck-build" content="2026-09-23.1">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230d1219'/><rect x='20' y='24' width='60' height='14' rx='5' fill='%23f5c24c'/><rect x='20' y='46' width='38' height='10' rx='4' fill='%23415066'/><rect x='20' y='64' width='50' height='10' rx='4' fill='%23415066'/></svg>">
<style>
:root{
  --accent:#f5c24c;
  --bg:#0d1219;
  --bg2:#131b25;
  --card:#161f2b;
  --card2:#1b2532;
  --line:#243040;
  --tx:#e8edf4;
  --tx2:#8b9bb0;
  --tx3:#5d6c80;
  --up:#3ddc97;
  --down:#ff6b6b;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  background:var(--bg);
  background-image:radial-gradient(1200px 600px at 15% -10%,rgba(255,255,255,.05),transparent 60%),radial-gradient(900px 500px at 90% 0%,rgba(245,194,76,.05),transparent 60%);
  background-attachment:fixed;
  color:var(--tx);
  font-family:'Space Grotesk',system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:15px;
  padding:34px clamp(16px,3vw,44px) 60px;
  -webkit-font-smoothing:antialiased;
}
body.bg-img{background-size:cover;background-position:center}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent);color:#111}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* HEADER */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap}
.hello{font-size:clamp(30px,4.4vw,52px);font-weight:700;letter-spacing:-.02em;line-height:1}
.hud{display:flex;align-items:center;gap:16px}
.weather{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 20px;min-height:64px}
.weather[hidden]{display:none}
.weather .ico{font-size:26px;line-height:1}
.weather .t{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:500;line-height:1}
.weather .c{font-size:12px;color:var(--tx2);margin-top:3px}
.clockbox{text-align:right}
.clock{font-family:'JetBrains Mono',monospace;font-size:clamp(28px,3.4vw,40px);font-weight:500;letter-spacing:.02em;line-height:1}
.date{font-size:12.5px;color:var(--tx2);margin-top:5px}
.gear{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;color:var(--tx2);transition:.2s}
.gear:hover{color:var(--accent);border-color:var(--accent);transform:rotate(35deg)}

/* SEARCH */
.searchwrap{max-width:720px;margin:38px auto 0;position:relative}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 10px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.engine{position:relative}
.engine>button{padding:8px 12px;border-radius:9px;color:var(--tx2);font-size:14px;font-weight:500;display:flex;gap:6px;align-items:center;white-space:nowrap}
.engine>button:hover{background:var(--card2);color:var(--tx)}
.search input{flex:1;background:none;border:none;outline:none;font-size:16px;padding:8px 4px;min-width:0}
.search input::placeholder{color:var(--tx3)}
.go{width:38px;height:38px;border-radius:10px;background:var(--accent);color:#14181f;display:grid;place-items:center;flex:none}
.go:hover{filter:brightness(1.1)}
.menu{position:absolute;z-index:40;top:calc(100% + 6px);left:0;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:170px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.menu button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:8px;font-size:14px;color:var(--tx2)}
.menu button:hover{background:var(--card);color:var(--tx)}
.menu button[aria-selected=true]{color:var(--accent)}
.sugg{position:absolute;z-index:35;top:calc(100% + 8px);left:0;right:0;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 20px 45px rgba(0,0,0,.5);overflow:hidden}
.sugg a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;font-size:14.5px}
.sugg a img{width:18px;height:18px;border-radius:4px}
.sugg a .u{margin-left:auto;font-size:12px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40%}
.sugg a:hover,.sugg a.sel{background:var(--card)}

/* TABS */
.tabs{display:flex;align-items:center;gap:6px;margin:34px 0 22px;flex-wrap:wrap}
.tab{padding:11px 20px;border-radius:11px;color:var(--tx2);font-weight:500;border:1px solid transparent;transition:.15s}
.tab:hover{color:var(--tx);background:var(--card)}
.tab.on{color:var(--accent);background:var(--card);border-color:rgba(245,194,76,.28)}
.tab-add{width:42px;height:42px;border-radius:11px;border:1px dashed var(--line);color:var(--tx3);display:grid;place-items:center;font-size:19px}
.tab-add:hover{color:var(--accent);border-color:var(--accent)}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:border-color .18s,box-shadow .18s}
.card:hover{border-color:#2e3c4f}
.card.drag{opacity:.35}
.card.over{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.chead{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;border-bottom:1px solid var(--line)}
.grip{color:var(--tx3);cursor:grab;font-size:14px;letter-spacing:-2px;line-height:1;padding:2px 3px}
.grip:active{cursor:grabbing}
.ctitle{font-weight:600;font-size:16px;flex:1;border-radius:6px;padding:2px 5px;margin-left:-5px;cursor:text}
.ctitle:hover{background:var(--card2)}
.ctitle[contenteditable]:focus{outline:1px solid var(--accent);background:var(--bg)}
.cact{display:flex;gap:2px;opacity:0;transition:.15s}
.card:hover .cact{opacity:1}
.iconbtn{width:28px;height:28px;border-radius:8px;color:var(--tx3);display:grid;place-items:center}
.iconbtn:hover{background:var(--card2);color:var(--tx)}
.iconbtn.danger:hover{color:var(--down)}
.cbody{padding:14px}

/* LINKS */
.lnk{display:flex;align-items:center;gap:13px;padding:9px 10px;border-radius:10px;transition:.15s}
.lnk:hover{background:var(--card2)}
.lnk img{width:22px;height:22px;border-radius:5px;flex:none;background:var(--card2)}
.lnk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnk .x{margin-left:auto;opacity:0;color:var(--tx3);padding:0 4px;font-size:16px}
.lnk:hover .x{opacity:1}
.lnk .x:hover{color:var(--down)}
.add{display:flex;align-items:center;gap:9px;width:100%;padding:12px;margin-top:6px;border:1px dashed var(--line);border-radius:11px;color:var(--tx3);font-size:14px}
.add:hover{border-color:var(--accent);color:var(--accent)}

/* NOTES */
.notes{width:100%;min-height:150px;background:none;border:none;outline:none;resize:vertical;font-size:14.5px;line-height:1.65;color:var(--tx);padding:4px}
.notes::placeholder{color:var(--tx3)}

/* TASKS */
.task{display:flex;gap:12px;align-items:flex-start;padding:9px 8px;border-radius:10px}
.task:hover{background:var(--card2)}
.task .box{width:20px;height:20px;flex:none;border:1.5px solid var(--tx3);border-radius:6px;margin-top:1px;display:grid;place-items:center;font-size:12px;color:#14181f}
.task.done .box{background:var(--accent);border-color:var(--accent)}
.task.done .txt{color:var(--tx3);text-decoration:line-through}
.task .txt{flex:1;line-height:1.45;font-size:14.5px;cursor:text;border-radius:5px;padding:0 3px}
.task .x{opacity:0;color:var(--tx3)}
.task:hover .x{opacity:1}
.newtask{width:100%;padding:12px;margin-top:6px;background:none;border:1px dashed var(--line);border-radius:11px;color:var(--tx);font-size:14px;outline:none}
.newtask::placeholder{color:var(--tx3)}
.newtask:focus{border-color:var(--accent);border-style:solid}
.count{font-size:12px;color:var(--tx3);padding:10px 4px 0}

/* MARKETS */
.row{display:flex;align-items:center;gap:12px;padding:13px 6px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .n{font-weight:600;font-size:14px;letter-spacing:.04em;flex:1}
.row .p{font-family:'JetBrains Mono',monospace;font-size:14px}
.row .d{font-family:'JetBrains Mono',monospace;font-size:13px;min-width:66px;text-align:right}
.up{color:var(--up)}.down{color:var(--down)}
.muted{color:var(--tx3);font-size:13.5px;padding:8px 4px;line-height:1.6}

/* WEATHER CARD */
.wbig{display:flex;align-items:center;gap:18px;padding:6px 4px 16px}
.wbig .i{font-size:46px}
.wbig .d{font-family:'JetBrains Mono',monospace;font-size:38px;font-weight:500}
.wdays{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;border-top:1px solid var(--line);padding-top:14px}
.wday{text-align:center;font-size:12.5px;color:var(--tx2)}
.wday .e{font-size:20px;display:block;margin:5px 0}
.wday .m{font-family:'JetBrains Mono',monospace;color:var(--tx);font-size:13px}

/* RSS */
.feed{display:block;padding:11px 8px;border-radius:9px;border-bottom:1px solid var(--line)}
.feed:last-child{border-bottom:none}
.feed:hover{background:var(--card2)}
.feed b{display:block;font-weight:500;font-size:14px;line-height:1.45}
.feed i{font-style:normal;font-size:11.5px;color:var(--tx3)}

.addcard{display:block;margin:34px auto 0;padding:13px 26px;border:1px dashed var(--line);border-radius:12px;color:var(--tx3);font-size:14px}
.addcard:hover{border-color:var(--accent);color:var(--accent)}
footer{text-align:center;color:var(--tx3);font-size:12.5px;margin-top:26px}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(6,9,13,.72);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;z-index:100}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:20px;width:min(560px,100%);max-height:86vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:22px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg2)}
.mhead h2{font-size:19px;font-weight:600}
.mbody{padding:22px 24px}
.close{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);color:var(--tx2);display:grid;place-items:center}
.close:hover{color:var(--tx);background:var(--card)}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:12px}
.type{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 10px;text-align:center;color:var(--tx2);transition:.15s}
.type:hover{border-color:var(--accent);color:var(--tx);transform:translateY(-2px)}
.type .e{font-size:26px;display:block;margin-bottom:9px}
label.f{display:block;margin-bottom:16px}
label.f span{display:block;font-size:12.5px;color:var(--tx2);margin-bottom:7px}
.in{width:100%;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 14px;outline:none;font-size:15px}
.in:focus{border-color:var(--accent)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:10px;border:2px solid transparent}
.sw[aria-pressed=true]{border-color:#fff}
.btns{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.btn{padding:11px 18px;border-radius:11px;border:1px solid var(--line);color:var(--tx2);font-size:14px}
.btn:hover{color:var(--tx);background:var(--card)}
.btn.pri{background:var(--accent);color:#14181f;border-color:var(--accent);font-weight:600}
.btn.pri:hover{filter:brightness(1.08);background:var(--accent)}
.sep{height:1px;background:var(--line);margin:22px 0}
.hint{font-size:12.5px;color:var(--tx3);line-height:1.6;margin-top:8px}
@media(max-width:640px){
  body{padding:20px 14px 46px}
  .top{gap:14px}
  .hud{width:100%;justify-content:space-between}
  .tabs{margin:26px 0 18px}
  .grid{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.savebar{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin:20px 0 0;color:var(--tx2);font-size:13px}
.savebar button{padding:8px 12px;border:1px solid var(--line);border-radius:9px;color:var(--accent)}
.savebar [data-error=true]{color:var(--down)}
.card:focus-within .cact,.lnk:focus-within .x,.task:focus-within .x{opacity:1}
.card,.hud,.clockbox{min-width:0}
.ctitle{overflow-wrap:anywhere;min-width:0}
.notice{line-height:1.6;font-size:14px;color:var(--tx2);margin:12px 0}
@media(hover:none){.cact,.lnk .x,.task .x{opacity:1}.iconbtn{width:36px;height:36px}.in{font-size:16px}}
@media(max-width:380px){.hud{gap:8px;flex-wrap:wrap}.weather{padding:10px;gap:8px}.clock{font-size:26px}.engine>button{padding:8px 4px}}
.grid{grid-template-columns:repeat(12,minmax(0,1fr))}
.card{grid-column:span 4}
.card[data-type="notes"]{grid-column:span 8}
.card[data-wide="true"]{grid-column:1/-1}
.card[data-compact="true"]{grid-column:span 4}
.cact,.task .x,.lnk .x{opacity:1}
.chead{flex-wrap:wrap;gap:6px}.cact{margin-left:auto}
.tab-group{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.tab-group .tab{border:0;margin:0}
.tab-options{min-width:36px;min-height:42px;color:var(--tx2);font-size:22px;border-left:1px solid var(--line)}
.tab-options:hover{color:var(--accent)}
.note-toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.note-toolbar button,.task-actions button{min-width:34px;min-height:34px;border:1px solid var(--line);border-radius:7px;color:var(--tx2)}
.note-toolbar button:hover,.task-actions button:hover{background:var(--card2);color:var(--accent)}
.note-toolbar .editor-hint{font-size:12px;color:var(--tx3);margin-left:6px}
.notes{display:block;height:clamp(280px,48vh,580px);min-height:220px;max-height:80vh;overflow:auto;resize:vertical;white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;line-height:1.7;scrollbar-gutter:stable}
.notes:focus{border-color:var(--accent)}
.notes:empty::before{content:attr(data-placeholder);color:var(--tx3);pointer-events:none}
.notes ul,.notes ol{padding-left:24px}.notes p{margin-bottom:.6em}
.task .txt{overflow-wrap:anywhere;min-width:0;white-space:pre-wrap;text-align:left}
.task-actions{display:flex;gap:4px;flex-wrap:wrap;flex:none}
.task.done .txt{text-decoration:none}.task.done .txt>*{text-decoration:line-through}
.task-editor{height:160px;min-height:120px}
button:disabled{opacity:.35;cursor:default}
.card[data-type="markets"] .cbody,.card[data-type="weather"] .cbody,.card[data-type="rss"] .cbody{min-height:240px}
@media(max-width:1050px){.card,.card[data-compact="true"]{grid-column:span 6}.card[data-type="notes"],.card[data-wide="true"]{grid-column:1/-1}}
@media(max-width:700px){.card,.card[data-compact="true"]{grid-column:1/-1}.notes{height:360px;max-height:none;font-size:16px}.task{flex-wrap:wrap}.task .txt{flex-basis:calc(100% - 40px)}.task-actions{margin-left:32px}.tab{padding:10px 12px}}
</style>
</head>

<script id="startdeck-core">
function safeUrl(value){
  try{const u=new URL(value);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}
}
function validateState(value){
  const d=JSON.parse(JSON.stringify(value));
  const fail=()=>{throw new Error('Données StartDeck invalides. Aucun remplacement effectué.')};
  if(!d||!d.settings||typeof d.settings!=='object'||!Array.isArray(d.tabs)||!d.tabs.length)fail();
  const text=v=>typeof v==='string';
  const ids=new Set();
  for(const t of d.tabs){
    if(!t||!text(t.id)||!text(t.name)||!Array.isArray(t.cards)||ids.has(t.id))fail();ids.add(t.id);
    for(const c of t.cards){
      if(!c||!text(c.id)||!text(c.title)||ids.has(c.id)||!['notes','links','tasks','weather','markets','rss'].includes(c.type))fail();ids.add(c.id);
      if(c.type==='notes'&&!text(c.text??''))fail();
      if(c.html!==undefined&&!text(c.html))fail();
      if(['links','tasks'].includes(c.type)){
        if(!Array.isArray(c.items))fail();
        for(const i of c.items){if(!i||!text(i.t))fail();if(i.html!==undefined&&!text(i.html))fail();if(c.type==='links'&&!safeUrl(i.u))fail();}
      }
      if(c.city!==undefined&&!text(c.city))fail();
      if(c.coins!==undefined&&(!Array.isArray(c.coins)||!c.coins.every(text)))fail();
      if(c.url&&!safeUrl(c.url))fail();
    }
  }
  for(const k of ['name','city','accent','bg','engine'])if(d.settings[k]!==undefined&&!text(d.settings[k]))fail();
  if(d.settings.bg&&!safeUrl(d.settings.bg))fail();
  d.settings={name:'',city:'Paris',accent:'#f5c24c',bg:'',engine:'google',...d.settings};
  if(!['google','ddg','bing','perplexity','youtube','github','tv'].includes(d.settings.engine))d.settings.engine='google';

/* Le HTML des notes reste limité à la mise en forme, sans liens ni attributs actifs. */
function sanitizeRich(html){
  const doc=new DOMParser().parseFromString(String(html),'text/html');
  const allowed=new Set(['B','STRONG','I','EM','U','S','STRIKE','BR','DIV','P','UL','OL','LI']);
  const clean=node=>{
    if(node.nodeType===3)return document.createTextNode(node.nodeValue);
    const fragment=document.createDocumentFragment();
    if(node.nodeType!==1||['SCRIPT','STYLE','IFRAME','OBJECT','SVG','MATH','IMG'].includes(node.tagName))return fragment;
    let out=allowed.has(node.tagName)?document.createElement(node.tagName.toLowerCase()):fragment;
    // Les navigateurs représentent parfois le soulignement et le barré par des spans.
    if(node.tagName==='SPAN'){
      const marks=[];if(node.style.fontWeight==='bold'||Number(node.style.fontWeight)>=600)marks.push('b');
      if(node.style.textDecoration.includes('underline')||node.style.textDecorationLine.includes('underline'))marks.push('u');
      if(node.style.textDecoration.includes('line-through')||node.style.textDecorationLine.includes('line-through'))marks.push('s');
      for(const mark of marks){const el=document.createElement(mark);out.appendChild(el);out=el}
    }
    for(const child of node.childNodes)out.appendChild(clean(child));
    return fragment.childNodes.length?fragment:out;
  };
  const holder=document.createElement('div');for(const node of doc.body.childNodes)holder.appendChild(clean(node));return holder.innerHTML;
}
function editorText(el){return typeof el.innerText==='string'?el.innerText:el.textContent}
function richEditor(container,{text='',html,save:commit,label='Note',className=''}){
  const toolbar=document.createElement('div');toolbar.className='note-toolbar';toolbar.setAttribute('role','toolbar');toolbar.setAttribute('aria-label','Mise en forme');
  const editor=document.createElement('div');editor.className='notes '+className;editor.setAttribute('contenteditable','true');editor.setAttribute('role','textbox');editor.setAttribute('aria-multiline','true');editor.setAttribute('aria-label',label);editor.dataset.placeholder='Écrivez ici…';editor.spellcheck=true;
  if(typeof html==='string')editor.innerHTML=sanitizeRich(html);else editor.textContent=text;
  let composing=false,selection;
  const remember=()=>{const sel=window.getSelection();if(sel?.rangeCount&&editor.contains(sel.anchorNode)&&editor.contains(sel.focusNode))selection=sel.getRangeAt(0).cloneRange()};
  const changed=()=>{if(!composing&&commit)commit(editorText(editor),sanitizeRich(editor.innerHTML))};
  editor.addEventListener('compositionstart',()=>composing=true);editor.addEventListener('compositionend',()=>{composing=false;changed()});
  editor.addEventListener('input',changed);editor.addEventListener('keyup',remember);editor.addEventListener('mouseup',remember);editor.addEventListener('touchend',remember);
  const format=command=>{
    const pageY=window.scrollY,top=editor.scrollTop;editor.focus({preventScroll:true});
    if(selection){try{const sel=window.getSelection();sel.removeAllRanges();sel.addRange(selection)}catch{}}
    if(document.execCommand)document.execCommand(command,false,null);
    remember();changed();editor.scrollTop=top;window.scrollTo(window.scrollX,pageY);
  };
  for(const [command,name,markup] of [['bold','Gras','<b>G</b>'],['underline','Souligner','<u>S</u>'],['strikeThrough','Barrer','<s>B</s>'],['removeFormat','Retirer la mise en forme','Tx']]){
    const button=document.createElement('button');button.type='button';button.dataset.command=command;button.title=name;button.setAttribute('aria-label',name);button.innerHTML=markup;
    button.onpointerdown=e=>{remember();e.preventDefault()};button.onclick=()=>format(command);toolbar.appendChild(button);
  }
  const hint=document.createElement('span');hint.className='editor-hint';hint.textContent='Sélectionnez du texte, puis choisissez sa mise en forme.';toolbar.appendChild(hint);
  editor.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['b','u'].includes(e.key.toLowerCase())){e.preventDefault();remember();format(e.key.toLowerCase()==='b'?'bold':'underline')}});
  editor.addEventListener('paste',e=>{
    e.preventDefault();const text=e.clipboardData?.getData('text/plain')||'';
    if(document.execCommand)document.execCommand('insertText',false,text);changed();
  });
  editor.addEventListener('drop',e=>e.preventDefault());
  container.append(toolbar,editor);return editor;
}

      o.querySelector('#saveTask').onclick=()=>{const text=editorText(editor).trim();if(!text){alert('Saisissez un texte ou utilisez le bouton Supprimer.');return}it.t=text;it.html=sanitizeRich(editor.innerHTML);save();o.remove();redraw()};
    };
    r.querySelector('.txt').onclick=edit;r.querySelector('[data-edit]').onclick=edit;
    r.querySelector('[data-delete]').onclick=()=>{if(confirm('Supprimer cette tâche ?'))protectedChange(()=>{c.items.splice(i,1);save();redraw()})};
    const move=delta=>{c.items.splice(i+delta,0,c.items.splice(i,1)[0]);save();redraw()};

  });

  body.append(inp,count);updateCount();
}

// Seules l'URL du projet et sa clé PUBLIQUE peuvent être intégrées ici.
const DEFAULT_CLOUD={url:'',key:''};
const CLOUD_KEY='startdeck.cloud.v1',SESSION_KEY='startdeck.session.v1';
let cloud=DEFAULT_CLOUD,session=null,syncBusy=false,remoteConflict=null;
try{cloud=JSON.parse(localStorage.getItem(CLOUD_KEY))||DEFAULT_CLOUD;session=JSON.parse(localStorage.getItem(SESSION_KEY))}catch{}
function editing(){return !!document.querySelector('.overlay')||document.activeElement?.matches('input,textarea,[contenteditable="true"]')}

function validateCloud(url,key){
  const u=new URL(url);
  if(u.protocol!=='https:'||!/^[-a-z0-9]+\.supabase\.co$/.test(u.hostname)||u.pathname!=='/'||u.search||u.hash||u.username||u.password)throw Error('Utilisez l’URL https://votre-projet.supabase.co');
  let allowed=key.startsWith('sb_publishable_');
  if(!allowed){try{allowed=JSON.parse(atob(key.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).role==='anon'}catch{}}
  if(!allowed)throw Error('Utilisez uniquement une clé publique publishable ou anon, jamais une clé secrète.');
  return {url:u.origin,key};
}
async function cloudRequest(path,{method='GET',body,auth=true,config=cloud}={}){
  const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),15000);
  try{
    const headers={apikey:config.key,'Content-Type':'application/json'};
    if(auth){if(!session?.access_token)throw Error('Connectez-vous pour synchroniser.');headers.Authorization='Bearer '+session.access_token}
    const r=await fetch(config.url+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body),cache:'no-store',signal:controller.signal});
    const d=await r.json().catch(()=>null);
    if(!r.ok){const e=new Error(r.status===401?'Session expirée : reconnectez-vous.':r.status===409?'Conflit : une autre version vient d’être enregistrée.':r.status>=500?'Service indisponible. Les données restent sur cet appareil.':(d?.msg||d?.message||d?.error_description||'Configuration ou connexion à vérifier.'));e.status=r.status;throw e}
    return d;
  }finally{clearTimeout(timeout)}
}
async function ensureSession(){
  // La session peut avoir été renouvelée dans un autre onglet.
  session=JSON.parse(localStorage.getItem(SESSION_KEY));
  if(!session?.user?.id)throw Error('Connectez-vous pour synchroniser.');
  if(session.expires_at*1000<Date.now()+60000){
    session=await cloudRequest('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:session.refresh_token},auth:false});
    localStorage.setItem(SESSION_KEY,JSON.stringify(session));
  }
}
async function syncNow(){
  if(syncBusy||storageFailed||!cloud.url||!session||document.hidden)return;
  if(!navigator.onLine){setSaveStatus('Hors connexion · synchronisation en attente');return}
  const run=async()=>{
    syncBusy=true;
    try{
      await ensureSession();
      const owner=cloud.url+'/'+session.user.id;
      if(store.owner&&store.owner!==owner)throw Error('Ces données appartiennent à un autre compte. Utilisez un profil de navigateur distinct.');
      const rows=await cloudRequest('/rest/v1/startdeck_state?select=data,revision,updated_at&user_id=eq.'+encodeURIComponent(session.user.id));
      if(!Array.isArray(rows))throw Error('Réponse du stockage invalide.');
      const remote=rows[0],revision=remote?.revision||0;
      if(remote)remote.data=validateState(remote.data);
      const choice=syncDecision(store,revision);
      if(choice==='conflict'){
        remoteConflict=remote;setSaveStatus('Deux versions modifiées · choisissez dans Synchronisation',true);return;
      }
      if(choice==='pull'){
        if(editing()){setSaveStatus('Nouvelle version de vos données en attente de la fin de saisie');return}
        backup();S=remote.data;store={data:S,base:revision,dirty:false,owner};
        if(!persist())return;refreshView();
      }else if(choice==='push'){
        if(remoteConflict)return;
        const sent=JSON.stringify(validateState(S));
        const result=await cloudRequest('/rest/v1/rpc/startdeck_save',{method:'POST',body:{expected_revision:store.base??0,new_data:JSON.parse(sent)}});
        if(!Number.isSafeInteger(result?.revision))throw Error('Réponse de sauvegarde invalide.');
        store.base=result.revision;store.owner=owner;store.dirty=JSON.stringify(S)!==sent;
        if(!persist())return;
      }
      remoteConflict=null;
      setSaveStatus(store.dirty?'Modifications suivantes en attente':'Synchronisé · '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}));
      if(store.dirty){clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(),1000)}
    }catch(e){setSaveStatus(e.name==='AbortError'?'Connexion trop lente · données conservées sur cet appareil':e.message,true)}
    finally{syncBusy=false}
  };
  if(navigator.locks)await navigator.locks.request('startdeck-sync',{ifAvailable:true},async lock=>{if(lock)await run()});
  else await run();
}
document.getElementById('btnSync').onclick=()=>{
  const o=modal('Synchronisation entre appareils',`
    <p class="notice">${session?'Connecté : '+esc(session.user?.email||'votre compte'):'Vos données sont actuellement enregistrées sur cet appareil. Connectez chaque appareil au même compte pour les partager.'}</p>
    <p class="notice">Un projet Supabase doit être configuré une seule fois. <a href="./SYNC-SETUP.md" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:underline">Instructions d’activation</a>. Ne saisissez jamais une clé secrète.</p>
    <label class="f"><span>URL du projet Supabase</span><input class="in" id="cloudUrl" type="url" value="${esc(cloud.url||'')}" placeholder="https://votre-projet.supabase.co"></label>
    <label class="f"><span>Clé publique (publishable ou anon)</span><input class="in" id="cloudKey" value="${esc(cloud.key||'')}" autocomplete="off"></label>
    <label class="f"><span>Adresse e-mail du compte</span><input class="in" id="cloudEmail" type="email" autocomplete="username" value="${esc(session?.user?.email||'')}"></label>
    <label class="f"><span>Mot de passe du compte</span><input class="in" id="cloudPassword" type="password" autocomplete="current-password"></label>
    <p class="notice" id="cloudMessage" role="status"></p>
    <div class="btns"><button class="btn" id="cloudExport">Exporter mes données</button><button class="btn pri" id="cloudLogin">Se connecter</button>${session?'<button class="btn" id="cloudNow">Synchroniser maintenant</button><button class="btn" id="cloudLogout">Déconnecter cet appareil</button>':''}</div>
    ${remoteConflict?'<div class="sep"></div><p class="notice">Deux appareils ont été modifiés. Exportez les deux versions avant de choisir : elles ne seront pas fusionnées automatiquement.</p><div class="btns"><button class="btn" id="exportRemote">Exporter la version en ligne</button><button class="btn" id="keepLocal">Garder cet appareil</button><button class="btn" id="keepRemote">Utiliser la version en ligne</button></div>':''}`);
  const message=o.querySelector('#cloudMessage');
  o.querySelector('#cloudExport').onclick=()=>download(S);
  o.querySelector('#cloudLogin').onclick=async()=>{
    const button=o.querySelector('#cloudLogin');button.disabled=true;
    try{
      if(syncBusy)throw Error('Une synchronisation est en cours. Réessayez dans quelques secondes.');
      const config=validateCloud(o.querySelector('#cloudUrl').value.trim(),o.querySelector('#cloudKey').value.trim());
      const email=o.querySelector('#cloudEmail').value.trim(),password=o.querySelector('#cloudPassword').value;
      if(!email||!password)throw Error('Renseignez votre e-mail et votre mot de passe.');
      const signed=await cloudRequest('/auth/v1/token?grant_type=password',{method:'POST',body:{email,password},auth:false,config});
      if(store.owner&&store.owner!==config.url+'/'+signed.user.id)throw Error('Cette copie est liée à un autre compte. Utilisez un autre profil de navigateur.');
      cloud=config;
      localStorage.setItem(CLOUD_KEY,JSON.stringify(cloud));localStorage.setItem(SESSION_KEY,JSON.stringify(signed));session=signed;
      o.querySelector('#cloudPassword').value='';o.remove();await syncNow();
    }catch(e){message.textContent=e.message}finally{button.disabled=false}
  };
  if(session){
    o.querySelector('#cloudNow').onclick=()=>{o.remove();syncNow()};
    o.querySelector('#cloudLogout').onclick=()=>{
      if(syncBusy){message.textContent='Attendez la fin de la synchronisation.';return}
      localStorage.removeItem(SESSION_KEY);session=null;remoteConflict=null;setSaveStatus('Déconnecté · données conservées sur cet appareil');o.remove();
    };
  }
  if(remoteConflict){
    const remote=remoteConflict;
    o.querySelector('#exportRemote').onclick=()=>download(remote.data,'startdeck-version-en-ligne');
    o.querySelector('#keepLocal').onclick=()=>{
      if(syncBusy)return;
      if(!confirm('Remplacer la version en ligne par celle de cet appareil ? La version en ligne sera conservée en sauvegarde locale.'))return;
      try{backup(remote.data);store.base=remote.revision;store.dirty=true;remoteConflict=null;if(persist()){o.remove();syncNow()}}catch(e){message.textContent=e.message}
    };
    o.querySelector('#keepRemote').onclick=()=>{
      if(syncBusy)return;
      if(!confirm('Remplacer les données de cet appareil par la version en ligne ? Une sauvegarde de cet appareil sera conservée.'))return;
      try{backup();S=remote.data;store.base=remote.revision;store.dirty=false;store.owner=cloud.url+'/'+session.user.id;remoteConflict=null;if(persist()){o.remove();refreshView();syncNow()}}catch(e){message.textContent=e.message}
    };
  }
};
window.addEventListener('storage',e=>{
  if(e.key===SESSION_KEY){try{session=e.newValue?JSON.parse(e.newValue):null}catch{}return}
  if(e.key!==STORE_KEY||!e.newValue||storageFailed)return;
  if(editing()){setSaveStatus('Un autre onglet a changé les données : terminez puis rechargez.',true);return}
  try{const next=JSON.parse(e.newValue);S=validateState(next.data);store=next;lastStored=e.newValue;refreshView();setSaveStatus('Mis à jour depuis un autre onglet')}catch{}
});
window.addEventListener('online',()=>syncNow());
window.addEventListener('offline',()=>setSaveStatus('Hors connexion · sauvegarde locale'));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncNow()});
setInterval(()=>syncNow(),15000);

/* ---------- versions du site et mode hors connexion ---------- */
const updateButton=document.getElementById('btnUpdate');
const pageSignature=doc=>[...doc.querySelectorAll('script:not([src]),style')].map(el=>el.textContent).join('\n');
const loadedSignature=pageSignature(document);
let updateFound=false,checkingUpdate=false,lastInput=Date.now(),registration;
document.addEventListener('input',()=>{lastInput=Date.now()});
function applyUpdate(){if(storageFailed)return;document.activeElement?.blur();location.reload()}
updateButton.onclick=applyUpdate;
async function checkUpdate(){
  if(checkingUpdate||document.hidden||!navigator.onLine||!/^https?:$/.test(location.protocol))return;
  checkingUpdate=true;const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),10000);
  try{
    if(registration)registration.update().catch(()=>{});
    const url=new URL('./index.html',location.href);url.searchParams.set('_sd_check',Date.now());
    const res=await fetch(url,{cache:'no-store',signal:controller.signal});
    if(!res.ok||!res.headers.get('content-type')?.includes('text/html'))return;
    const doc=new DOMParser().parseFromString(await res.text(),'text/html');
    if(!doc.querySelector('meta[name="startdeck-build"]'))return;
    updateFound=pageSignature(doc)!==loadedSignature;
    updateButton.hidden=!updateFound;
    // Une nouvelle version est proposée, jamais imposée pendant une session de travail.
  }catch{}finally{clearTimeout(timeout);checkingUpdate=false}
}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'}).then(r=>{registration=r}).catch(()=>{});
}
window.addEventListener('pageshow',()=>checkUpdate());
window.addEventListener('online',()=>checkUpdate());
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});
setInterval(checkUpdate,60000);

/* ---------- go ---------- */
applyTheme();
render();
tick();
headerWeather();
if(!storageFailed){
  try{if(!localStorage.getItem('startdeck.before-richtext.20260923')&&(lastStored||localStorage.getItem(KEY)))localStorage.setItem('startdeck.before-richtext.20260923',JSON.stringify({data:S}))}catch{setSaveStatus('Copie de sécurité impossible : exportez vos données dans Réglages.',true)}
  try{if(!localStorage.getItem(BACKUP_KEY)&&localStorage.getItem(KEY))backup()}catch{}
  persist();
  setSaveStatus(session?'Connexion à la synchronisation…':'Enregistré sur cet appareil · synchronisation non activée');
  syncNow();
}
</script>

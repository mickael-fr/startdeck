<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12171E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Permis C">
<meta name="description" content="Révision du permis C : interrogation écrite, interrogation orale et vérifications courantes de sécurité.">
<title>Révision Permis C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12171E; --panel:#1A212B; --card:#212B37; --card2:#26303D;
    --ink:#EAF0F5; --muted:#8B98A8; --faint:#5C6773;
    --line:#2E3843; --line2:#3A4652;
    --amber:#FFB020; --amber-d:#E39A12;
    --ok:#37C285; --warn:#FFB020; --bad:#F1585E;
    --display:"Archivo","Arial Narrow",system-ui,sans-serif;
    --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,monospace;
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(1100px 600px at 50% -10%, rgba(255,176,32,.06), transparent 60%),
      var(--bg);
    color:var(--ink); font-family:var(--body); line-height:1.5;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{max-width:760px; margin:0 auto; padding:20px 16px 64px}
  .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--faint)}

  /* ---------- Topbar ---------- */
  .top{display:flex; align-items:flex-start; gap:14px; margin:6px 0 22px}
  .badge{
    flex:0 0 auto; width:46px; height:46px; border-radius:11px;
    background:linear-gradient(160deg,#2A3543,#171E27); border:1px solid var(--line2);
    display:grid; place-items:center; font-family:var(--display); font-weight:800; letter-spacing:.02em;
    color:var(--amber); font-size:17px; box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
  }
  .top h1{font-family:var(--display); font-weight:800; letter-spacing:.03em; text-transform:uppercase;
    font-size:clamp(22px,6vw,30px); margin:0; line-height:1.02}
  .top .sub{color:var(--muted); font-size:13px; margin-top:3px}

  /* ---------- Readout strip ---------- */
  .readout{
    display:grid; grid-template-columns:repeat(3,1fr); gap:1px;
    background:var(--line); border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:22px;
  }
  .readout .cell{background:var(--panel); padding:12px 14px}
  .readout .k{font-family:var(--mono); font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--faint)}
  .readout .v{font-family:var(--display); font-weight:700; font-size:22px; margin-top:2px}
  .readout .v small{font-family:var(--body); font-weight:500; font-size:12px; color:var(--muted)}

  /* ---------- Buttons ---------- */
  .btn{appearance:none; border:1px solid var(--line2); background:var(--card); color:var(--ink);
    font-family:var(--body); font-weight:600; font-size:14px; padding:12px 16px; border-radius:11px; cursor:pointer;
    transition:transform .06s ease, background .15s ease, border-color .15s ease; -webkit-tap-highlight-color:transparent}
  .btn:hover{background:var(--card2); border-color:#465360}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.42; cursor:not-allowed}
  .btn:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
  .btn--primary{background:var(--amber); border-color:var(--amber); color:#1B1206}
  .btn--primary:hover{background:var(--amber-d); border-color:var(--amber-d)}
  .btn--ghost{background:transparent}
  .btn--ok{background:var(--ok); border-color:var(--ok); color:#06231A}
  .btn--ok:hover{filter:brightness(1.05); background:var(--ok)}
  .btn--bad{background:var(--bad); border-color:var(--bad); color:#2A0608}
  .btn--bad:hover{filter:brightness(1.05); background:var(--bad)}
  .btn--sm{padding:9px 12px; font-size:13px; border-radius:9px}

  .modes{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:26px}
  .modes .btn{display:flex; align-items:center; gap:10px; text-align:left; justify-content:flex-start; padding:14px 15px}
  .modes .btn .ic{font-size:18px; line-height:1}
  .modes .btn .lab{display:flex; flex-direction:column; gap:1px}
  .modes .btn .lab b{font-weight:700; font-size:14px}
  .modes .btn .lab span{font-weight:400; font-size:11.5px; color:var(--muted)}
  .btn--primary .lab span{color:rgba(27,18,6,.66)}

  /* ---------- Thèmes ---------- */
  .themes{display:flex; flex-direction:column; gap:8px; margin-bottom:26px}
  .theme-row{display:grid; grid-template-columns:1fr 84px 40px; gap:10px; align-items:center;
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px;
    cursor:pointer; text-align:left; font-family:var(--body); color:var(--ink); width:100%}
  .theme-row:hover{border-color:var(--line2); background:var(--card)}
  .theme-row:focus-visible{outline:2px solid var(--amber); outline-offset:1px}
  .theme-row__lab{font-size:12.5px}
  .theme-row__bar{height:6px; background:var(--line); border-radius:99px; overflow:hidden}
  .theme-row__bar>i{display:block; height:100%; border-radius:99px}
  .theme-row__val{font-family:var(--mono); font-size:11.5px; text-align:right; color:var(--muted)}

  /* ---------- Chrono d'examen ---------- */
  .examclock-wrap{display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--panel); border:1px solid var(--line2); border-radius:10px; padding:9px 13px; margin-bottom:12px}
  .examclock-lab{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint)}
  .examclock{font-family:var(--display); font-weight:800; font-size:19px; letter-spacing:.02em; color:var(--amber); font-variant-numeric:tabular-nums}
  .examclock.clock--danger{color:var(--bad); animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1} 50%{opacity:.45}}

  /* ---------- Badge examen ---------- */
  .examresult{display:inline-block; font-family:var(--display); font-weight:800; letter-spacing:.06em;
    font-size:15px; padding:8px 18px; border-radius:99px; margin-bottom:16px}
  .examresult--ok{background:rgba(55,194,133,.15); color:var(--ok); border:1px solid rgba(55,194,133,.42)}
  .examresult--bad{background:rgba(241,88,94,.15); color:var(--bad); border:1px solid rgba(241,88,94,.42)}

  /* ---------- Export / Import ---------- */
  .databar{display:flex; gap:10px; justify-content:center; margin-top:22px; flex-wrap:wrap}

  /* ---------- Onglets Écrit / Oral ---------- */
  .tabs{display:grid; grid-template-columns:1fr 1fr; gap:4px; background:var(--panel);
    border:1px solid var(--line); border-radius:12px; padding:4px; margin-bottom:22px}
  .tabs button{appearance:none; border:0; background:transparent; color:var(--muted); cursor:pointer;
    font-family:var(--display); font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    font-size:13px; padding:11px 8px; border-radius:9px; transition:background .15s ease, color .15s ease}
  .tabs button[aria-selected="true"]{background:var(--card2); color:var(--ink); box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
  .tabs button:focus-visible{outline:2px solid var(--amber); outline-offset:1px}
  .cstep{background:var(--card); border:1px solid var(--line2); border-radius:14px; padding:15px 16px; margin-bottom:10px}
  .cstep__n{display:inline-block; font-family:var(--display); font-weight:800; font-size:13px; color:#1B1206;
    background:var(--amber); border-radius:6px; padding:2px 9px; margin-bottom:9px}
  .cstep__t{font-family:var(--display); font-weight:700; font-size:17px; margin:0 0 8px; line-height:1.25}
  .cstep p{margin:0 0 7px; font-size:15px; line-height:1.5}
  .cstep p:last-child{margin-bottom:0}
  .cstep em{color:var(--amber); font-style:normal; font-weight:600}

  /* ---------- Oral ---------- */
  .planbox{background:var(--panel); border:1px solid var(--line2); border-left:3px solid var(--amber);
    border-radius:11px; padding:14px 16px; margin-bottom:18px}
  .planbox .k{font-family:var(--mono); font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--faint); margin-bottom:8px}
  .planbox ul{margin:0; padding-left:18px}
  .planbox li{font-size:13.5px; color:var(--ink); margin-bottom:5px; line-height:1.45}
  .planbox li:last-child{margin-bottom:0}

  .oral-tile{display:flex; flex-direction:column; gap:8px; padding:13px 14px; text-align:left;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; cursor:pointer; width:100%;
    font-family:var(--body); color:var(--ink); margin-bottom:9px}
  .oral-tile:hover{border-color:var(--line2); background:var(--card)}
  .oral-tile:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
  .oral-tile__top{display:flex; align-items:baseline; gap:9px}
  .oral-tile__n{font-family:var(--display); font-weight:800; font-size:13px; color:var(--amber); flex:0 0 auto}
  .oral-tile__t{font-size:13.5px; font-weight:500; line-height:1.35}
  .oral-tile__bar{height:5px; background:var(--line); border-radius:99px; overflow:hidden}
  .oral-tile__bar>i{display:block; height:100%; border-radius:99px}

  .dash{margin:14px 0 0; padding:0}
  .dash img{display:block; width:100%; height:auto; border-radius:11px; border:1px solid var(--line2); cursor:zoom-in}
  .dash figcaption{margin-top:7px; font-size:12px; color:var(--muted); line-height:1.4}
  .zoomwrap{position:fixed; inset:0; z-index:999; background:rgba(8,11,15,.96);
    display:flex; align-items:center; justify-content:center; padding:10px}
  .zoomwrap img{max-width:100%; max-height:100%; object-fit:contain; border-radius:8px}
  .zoomwrap .zclose{position:absolute; top:calc(12px + env(safe-area-inset-top)); right:14px;
    background:var(--card); color:var(--ink); border:1px solid var(--line2); border-radius:10px;
    font-family:var(--body); font-weight:600; font-size:14px; padding:9px 14px; cursor:pointer}
  .audiobar{background:var(--panel); border:1px solid var(--line2); border-radius:12px; padding:12px; margin-bottom:14px;
    position:sticky; top:6px; z-index:5}
  .audiorow{display:flex; align-items:center; gap:9px; margin-top:9px; flex-wrap:wrap}
  .ttsblock{background:var(--card); border:1px solid var(--line); border-radius:11px; padding:13px 14px; margin-bottom:9px}
  .ttsh{font-family:var(--display); font-weight:700; font-size:16px; margin-top:3px}
  .ttsbar{display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:11px 12px; margin-bottom:14px;
    background:var(--panel); border:1px solid var(--line2); border-radius:12px; position:sticky; top:6px; z-index:5}
  .ttsbar.is-playing{border-color:rgba(255,176,32,.55)}
  .tts-lab{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint)}
  .tts-state{margin-left:auto; font-family:var(--mono); font-size:11.5px; color:var(--muted)}
  .seg--rate button{padding:5px 9px; font-size:12px}
  .seg--rate button[aria-pressed="true"]{background:var(--card2); color:var(--ink)}
  .ttsdoc{display:flex; flex-direction:column; gap:2px}
  .ttsline{font-size:15px; line-height:1.5; padding:7px 10px; border-radius:8px; color:var(--muted);
    border-left:3px solid transparent; transition:background .18s ease, color .18s ease}
  .ttsline.tts-on{background:rgba(255,176,32,.12); border-left-color:var(--amber); color:var(--ink); font-weight:500}
  .ogroup__h{font-family:var(--mono); font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--faint)}
  .ogroup__g{font-family:var(--display); font-weight:700; font-size:21px; margin:5px 0 0; line-height:1.2}
  .opts{margin:16px 0 0; padding-left:20px}
  .opts li{font-size:15px; line-height:1.5; margin-bottom:9px}
  .opts li:last-child{margin-bottom:0}
  .recite{margin-top:18px; padding:14px; background:var(--panel); border:1px dashed var(--line2); border-radius:11px;
    text-align:center; color:var(--muted); font-size:13.5px}

  /* ---------- Onglets Écrit / Oral ---------- */
  .tabs{display:grid; grid-template-columns:1fr 1fr; gap:6px; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:5px; margin-bottom:20px}
  .tabs button{appearance:none; border:0; background:transparent; color:var(--muted); font-family:var(--display);
    font-weight:700; font-size:13.5px; letter-spacing:.04em; text-transform:uppercase; padding:11px 8px; border-radius:8px; cursor:pointer}
  .tabs button[aria-pressed="true"]{background:var(--amber); color:#1B1206}
  .tabs button:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
  .tabs--3{grid-template-columns:repeat(3,1fr)}
  .tabs--4{grid-template-columns:repeat(4,1fr); gap:4px}
  .tabs--4 button{font-size:12px; padding:11px 3px; letter-spacing:.01em}
  @media(max-width:390px){ .tabs--4 button{font-size:10.5px; padding:10px 2px} }

  /* ---------- Oral : liste des fiches ---------- */
  .ofiche{display:grid; grid-template-columns:34px 1fr 46px; gap:11px; align-items:center; width:100%; text-align:left;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 13px; margin-bottom:9px;
    cursor:pointer; font-family:var(--body); color:var(--ink)}
  .ofiche:hover{border-color:var(--line2); background:var(--card)}
  .ofiche:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
  .ofiche__n{font-family:var(--display); font-weight:800; font-size:20px; color:var(--amber); text-align:center}
  .ofiche__t{font-size:13.5px; line-height:1.35}
  .ofiche__m{font-size:11px; color:var(--faint); margin-top:3px; font-family:var(--mono)}
  .ofiche__s{font-family:var(--mono); font-size:11.5px; text-align:right}

  /* ---------- Oral : récitation ---------- */
  .ocard{background:var(--card); border:1px solid var(--line2); border-radius:18px; padding:20px}
  .ocard__parent{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); margin-bottom:5px}
  .ocard__h{font-family:var(--display); font-weight:800; font-size:23px; line-height:1.15; letter-spacing:.01em}
  .ocard__cue{margin-top:14px; padding:12px 13px; background:rgba(255,176,32,.07); border:1px solid rgba(255,176,32,.22);
    border-radius:10px; font-size:13.5px; color:#E8D9BD}
  .ocard__cue b{color:var(--amber)}
  .ptcount{font-family:var(--mono); font-size:11px; color:var(--faint); margin-top:9px}

  .pt-row{display:flex; gap:11px; align-items:flex-start; padding:11px 12px; background:var(--panel);
    border:1px solid var(--line); border-radius:10px; margin-bottom:8px; cursor:pointer; transition:border-color .12s, background .12s}
  .pt-row:hover{border-color:var(--line2)}
  .pt-row.on{border-color:rgba(55,194,133,.5); background:rgba(55,194,133,.09)}
  .pt-box{flex:0 0 auto; width:21px; height:21px; border-radius:6px; border:1.5px solid var(--line2);
    display:grid; place-items:center; font-size:12px; font-weight:700; color:transparent; margin-top:1px}
  .pt-row.on .pt-box{background:var(--ok); border-color:var(--ok); color:#06231A}
  .pt-txt{font-size:14px; line-height:1.45}
  .pt-row.on .pt-txt{color:var(--ink)}

  .tickbar{display:flex; gap:8px; margin:14px 0 0; flex-wrap:wrap}
  .tickbar .btn{flex:1; min-width:120px; justify-content:center}

  /* ---------- Oral : lecture ---------- */
  .oread h3{font-family:var(--display); font-weight:800; font-size:17px; letter-spacing:.02em; margin:22px 0 4px;
    padding-bottom:6px; border-bottom:1px solid var(--line2)}
  .oread h4{font-family:var(--display); font-weight:700; font-size:13px; letter-spacing:.05em; text-transform:uppercase;
    color:var(--amber); margin:16px 0 7px}
  .oread ul{margin:0; padding-left:19px}
  .oread li{font-size:14px; line-height:1.5; margin-bottom:5px; color:#DCE4EC}
  .planbox{background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--amber); border-radius:10px; padding:13px 15px; margin-bottom:6px}
  .planbox ol{margin:0; padding-left:19px}
  .planbox li{font-size:14px; line-height:1.5; margin-bottom:4px}

  /* ---------- Section header ---------- */
  .shead{display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 2px 12px}
  .shead .eyebrow{margin:0}
  .seg{display:inline-flex; background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:3px}
  .seg button{appearance:none; border:0; background:transparent; color:var(--muted); font-family:var(--body);
    font-weight:600; font-size:12.5px; padding:6px 12px; border-radius:6px; cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--card2); color:var(--ink)}
  .seg button:focus-visible{outline:2px solid var(--amber); outline-offset:1px}

  /* ---------- Fiche grid ---------- */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(90px,1fr)); gap:10px}
  .tile{display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 6px 11px;
    background:var(--panel); border:1px solid var(--line); border-radius:13px; cursor:pointer;
    transition:transform .06s ease, border-color .15s ease, background .15s ease; -webkit-tap-highlight-color:transparent}
  .tile:hover{border-color:#46535f; background:var(--card)}
  .tile:active{transform:translateY(1px)}
  .tile:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
  .tile__ey{font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint)}
  .tile__cap{font-size:11px; color:var(--muted)}
  .ring__num{font-family:var(--display); font-weight:700; font-size:22px; text-anchor:middle; dominant-baseline:central}

  .foot{margin-top:26px; text-align:center}
  .link{background:none; border:0; color:var(--faint); font-family:var(--body); font-size:12px; cursor:pointer; text-decoration:underline; text-underline-offset:3px}
  .link:hover{color:var(--muted)}

  /* ---------- Study (cards) ---------- */
  .study-top{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px}
  .study-top .eyebrow{color:var(--amber)}
  .counter{font-family:var(--mono); font-size:12px; letter-spacing:.08em; color:var(--muted)}
  .bar{height:5px; background:var(--line); border-radius:99px; overflow:hidden; margin-bottom:20px}
  .bar > i{display:block; height:100%; background:var(--amber); border-radius:99px; transition:width .3s ease}

  .qcard{background:var(--card); border:1px solid var(--line2); border-radius:18px; padding:22px 20px 20px; position:relative}
  .qcard__idx{font-family:var(--display); font-weight:800; font-size:13px; color:var(--faint); letter-spacing:.04em}
  .qcard__q{font-size:19px; line-height:1.42; margin:8px 0 0; font-weight:500}
  .qcard__sign{display:flex; gap:14px; align-items:center; margin-top:14px; padding:12px 14px;
    background:rgba(255,176,32,.07); border:1px solid rgba(255,176,32,.22); border-radius:11px; font-size:13.5px; color:#E8D9BD}
  .signart{flex:0 0 auto; display:block}
  .signart img{display:block; width:86px; height:auto; border-radius:8px; background:#fff;
    box-shadow:0 2px 8px rgba(0,0,0,.45)}
  .signcap{min-width:0}
  .tag{display:inline-block; font-family:var(--mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--amber); border:1px solid rgba(255,176,32,.4); border-radius:5px; padding:3px 6px; margin-bottom:5px}
  .li-signart{flex:0 0 auto}
  .li-signart img{display:block; width:62px; height:auto; border-radius:6px; background:#fff;
    box-shadow:0 1px 5px rgba(0,0,0,.4)}
  .li-signwrap{display:flex; gap:11px; align-items:center; margin:9px 0 0 33px}

  .reveal{margin-top:20px}
  .reveal .btn{width:100%; justify-content:center}

  .answer{margin-top:18px; border-top:1px dashed var(--line2); padding-top:18px; animation:rise .28s ease}
  @keyframes rise{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  .answer__lab{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); margin-bottom:6px}
  .answer__a{font-family:var(--display); font-weight:700; font-size:24px; line-height:1.2; color:var(--amber)}
  .answer__note{margin-top:10px; font-size:12.5px; color:var(--muted); background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--warn); border-radius:8px; padding:9px 11px}

  .grade{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:18px}

  /* ---------- Saisie de réponse ---------- */
  .choices{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:20px}
  .choice{justify-content:center; padding:16px; font-family:var(--display); font-weight:700; font-size:17px; letter-spacing:.02em}
  .txtrow{display:flex; gap:10px; margin-top:20px}
  .txtin{flex:1; min-width:0; background:var(--panel); border:1px solid var(--line2); border-radius:11px; color:var(--ink);

  .fb--ok{background:rgba(55,194,133,.15); color:var(--ok); border:1px solid rgba(55,194,133,.42)}
  .fb--bad{background:rgba(241,88,94,.14); color:var(--bad); border:1px solid rgba(241,88,94,.42)}
  .given{font-size:13px; color:var(--muted); margin-bottom:12px}
  .given b{color:var(--ink); font-weight:600}
  .hint{font-size:12.5px; color:var(--ok); margin-top:12px}
  .suggested{box-shadow:0 0 0 3px rgba(55,194,133,.28)}

  .nav{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:16px}
  .nav .side{display:flex; gap:8px}
  .kbd{margin-top:16px; text-align:center; font-family:var(--mono); font-size:11px; color:var(--faint)}
  .kbd b{color:var(--muted); font-weight:400}
  .key{display:inline-block; border:1px solid var(--line2); border-bottom-width:2px; border-radius:5px; padding:1px 6px; margin:0 1px; color:var(--muted); background:var(--panel)}

  /* ---------- List mode ---------- */
  .list-item{background:var(--panel); border:1px solid var(--line); border-radius:13px; padding:14px 15px; margin-bottom:10px; cursor:pointer}
  .list-item:hover{border-color:var(--line2)}
  .list-item .li-q{display:flex; gap:11px}
  .li-n{font-family:var(--display); font-weight:800; color:var(--amber); font-size:15px; flex:0 0 auto; width:22px}
  .li-qt{font-size:15px; line-height:1.4}
  .li-sign{margin:8px 0 0 33px; font-size:12.5px; color:#D9C8A6}
  .li-a{margin:10px 0 0 33px; font-family:var(--display); font-weight:700; color:var(--ink); font-size:16px; display:none}
  .li-a .li-al{display:block; font-family:var(--mono); font-weight:400; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); margin-bottom:2px}
  .li-a .li-note{display:block; font-family:var(--body); font-weight:400; font-size:12px; color:var(--muted); margin-top:7px}
  .list-item.open .li-a{display:block; animation:rise .2s ease}

  /* ---------- Result ---------- */
  .result{text-align:center; padding-top:6px}
  .bgauge__score{font-family:var(--display); font-weight:800; font-size:44px; text-anchor:middle; dominant-baseline:central}
  .bgauge__tot{font-family:var(--display); font-weight:600; font-size:22px}
  .bgauge__pct{font-family:var(--mono); font-size:14px; text-anchor:middle; dominant-baseline:central; letter-spacing:.06em}
  .bgauge__val{transition:stroke-dashoffset .95s cubic-bezier(.22,.61,.36,1)}
  .result h2{font-family:var(--display); font-weight:700; font-size:20px; margin:16px 0 4px}
  .result .rmsg{color:var(--muted); font-size:14px; margin:0 auto 22px; max-width:44ch}
  .rev-head{text-align:left; margin:26px 2px 12px}
  .result .actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:24px}

  @media (max-width:420px){
    .modes{grid-template-columns:1fr}
    .grid{grid-template-columns:repeat(auto-fill,minmax(80px,1fr))}
    .qcard__q{font-size:18px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important}
    .bgauge__val,.bar>i{transition:none !important}
  }
</style>

 {q:"Quel symbole devez-vous afficher sur l'écran du chronotachygraphe numérique lorsque vous partez déjeuner ?",a:"Le symbole « pause/repos »"},
 {q:"Faut-il un seul certificat d'immatriculation pour un ensemble constitué d'un camion de 19 t de PTAC auquel on a attelé une bétonnière sur roues de 400 kg ?",a:"Oui"},
 {q:"En règle générale, le chargement peut-il dépasser l'aplomb avant du véhicule ?",a:"Non"},
 {q:"Au-dessous de quelle hauteur libre d'un pont celle-ci sera-t-elle signalée ?",a:"4,30 m"},
 {q:"Circuler avec un seul pneu lisse ou détérioré peut entraîner l'immobilisation du véhicule jusqu'à son remplacement. Vrai ou Faux ?",a:"Vrai"},
 {q:"La marche arrière sert-elle à inverser le sens de rotation de l'arbre de transmission ?",a:"Oui"},
 {q:"Le circuit électrique alimentant le chronotachygraphe est-il indépendant du circuit alimentant le coupe-batteries ?",a:"Oui"}
]},
{n:13,q:[
 {q:"Les accidents corporels entre un poids lourd et une voiture sont majoritairement des accidents avec des véhicules circulant dans le même sens. Vrai ou Faux ?",a:"Vrai"},
 {q:"Je circule, à vide, avec un véhicule de 5 tonnes de poids à vide et de 15 tonnes de PTAC. À hauteur de ce signal, je peux passer ?",sign:"Panneau rond à bord rouge « 5,5 t » (poids total limité)",a:"Non"},
 {q:"Un premier arrêt de 15 min sur un parking peut-il être considéré comme une pause ?",a:"Oui"},
 {q:"Quel symbole devez-vous afficher sur l'écran du chronotachygraphe lors des vérifications du véhicule avant le départ ?",a:"Le symbole « autres tâches » (marteaux croisés)"},
 {q:"Que signifie la mention « TIR » placée sur une plaque à l'arrière du véhicule ?",a:"Transit International Routier"},
 {q:"Le poids réel d'un véhicule peut-il être égal à son PTAC ?",a:"Oui"},
 {q:"En agglomération, vous suivez un camion. Quel intervalle de sécurité minimum devez-vous respecter ?",a:"La distance parcourue en 2 secondes"},
 {q:"Dans une entreprise, le chargement est effectué par un manutentionnaire. Une fois terminé, vous appartient-il d'effectuer le contrôle de l'arrimage avant de démarrer ?",a:"Oui"},
 {q:"Un pont court permet d'obtenir un couple plus important et une vitesse du véhicule plus faible. Vrai ou Faux ?",a:"Vrai"},
 {q:"Quelle est la périodicité des vérifications techniques obligatoires pour les chronotachygraphes ?",a:"2 ans"}
]},
{n:14,q:[
 {q:"Si une partie de votre chargement est tombée sur la chaussée, par quel dispositif obligatoire devez-vous prévenir les autres usagers ?",a:"Le triangle de présignalisation"},
 {q:"Après l'obtention (hors diplômes professionnels) de votre premier permis du groupe lourd, quelle formation devez-vous effectuer avant de conduire dans le cadre d'un transport public de marchandises ?",a:"La FIMO (Formation Initiale Minimale Obligatoire)"},
 {q:"Si vous imprimez un ticket à partir d'un chronotachygraphe numérique, devez-vous inscrire votre nom sur le ticket si votre carte « conducteur » est insérée dans l'appareil au moment de l'impression ?",a:"Non"},
 {q:"Quelle est la durée de validité de votre carte « conducteur » ?",a:"5 ans"},
 {q:"La dernière visite technique de votre camion date de 8 mois. Êtes-vous en infraction en le conduisant ?",a:"Non"},
 {q:"En règle générale, quel est le PTAC maximal d'un véhicule isolé de 3 essieux ?",a:"26 t"},
 {q:"En général, un véhicule tracteur en solo est-il soumis aux mêmes limitations de vitesse que s'il est attelé ?",a:"Oui"},
 {q:"Ce signal peut-il concerner les véhicules transportant une faible quantité de produits polluants ?",sign:"Panneau rond à bord rouge : camion au-dessus de l'eau",a:"Oui"},
 {q:"Le mécanisme de direction comprend une « bielle pendante ». Vrai ou Faux ?",a:"Vrai"},
 {q:"En cas d'obligation, une paire de chaînes à neige doit être montée sur les roues motrices ou sur les roues directrices ?",a:"Les roues motrices"}
]},
{n:15,q:[
 {q:"Un chiffre doublé (ex. : 33) dans le rectangle du haut de la plaque orange placée à l'arrière d'un camion signifie « produit de nature à polluer les eaux ». Vrai ou Faux ?",a:"Faux"},
 {q:"Avec le permis C, quel est le PTAC maximum de la remorque que vous pouvez atteler derrière votre camion ?",a:"750 kg"},
 {q:"Le conducteur d'un véhicule de dépannage est-il soumis à la réglementation sociale européenne, dans un rayon de 100 km autour de son point d'attache ?",a:"Non"},
 {q:"Un conducteur peut-il demander une copie papier des données numériques, liées à son activité, conservées dans l'entreprise ?",a:"Oui"},
 {q:"La lettre de voiture doit détailler la nature des marchandises transportées. Vrai ou Faux ?",a:"Vrai"},
 {q:"Quelle est la charge utile d'un véhicule dont le PTAC est de 32 t et le poids à vide de 9 t ?",a:"23 t"},
 {q:"Sur le périphérique parisien, les camions peuvent circuler à 80 km/h. Vrai ou Faux ?",a:"Faux"},
 {q:"Ce signal m'indique-t-il un arrêt d'autobus ? Vrai ou Faux ?",sign:"Panneau bleu rond : autobus (voie réservée aux bus)",a:"Faux"},
 {q:"Quel type de suspension équipe généralement les véhicules lourds, permettant de régler la hauteur du véhicule ?",a:"La suspension pneumatique"},
 {q:"Le principal avantage du système de freinage antibloquant est-il de réduire les distances de freinage ?",a:"Non"}
]},
{n:16,q:[
 {q:"Le constat amiable d'accident peut-il constituer une preuve de responsabilité ?",a:"Oui"},
 {q:"Un conducteur ramenant, à vide, un camion-citerne de carburant non dégazé doit-il obligatoirement avoir suivi une formation particulière ?",a:"Oui"},
 {q:"Ce signal concerne-t-il les véhicules affectés aux seuls transports de produits polluants ?",sign:"Panneau rond à bord rouge : camion (marchandises)",a:"Non"},
 {q:"Sur un ticket imprimé à partir du chronotachygraphe numérique, peut-on trouver les temps de conduite et les temps passés aux autres tâches ?",a:"Oui"},
 {q:"La licence communautaire permet-elle d'effectuer des transports dans toute l'Union européenne ?",a:"Oui"},
 {q:"Quelle charge maximale autorisée peut supporter un essieu isolé ?",a:"13 t"},
 {q:"Vous conduisez un camion neuf de 19 t de PTAC. À quelle vitesse êtes-vous limité sur route prioritaire ?",a:"80 km/h"},
 {q:"Le recreusage des pneumatiques est-il une opération qui peut s'effectuer uniquement par un spécialiste ?",a:"Oui"},
 {q:"Vous avez fait une coupure de 4 h (repos). Quelle sera, au minimum, la durée de la période de repos suivante pour être en règle vis-à-vis du repos journalier ?",a:"9 h"},
 {q:"Vous chargez du sable. Vous voulez connaître la charge maximale autorisée par essieu ; vous pouvez la trouver sur la plaque de tare et de surface. Vrai ou Faux ?",a:"Faux"}
]},
{n:17,q:[
 {q:"Dans le transport routier, c'est pendant le travail, hors conduite, que l'on dénombre le plus fort taux d'accidents chez les conducteurs ?",a:"Oui"},
 {q:"En cas d'excès de vitesse de 42 km/h, je pourrai repartir si je reconnais l'infraction ?",a:"Non"},
 {q:"Pendant une pause, êtes-vous autorisé à décharger le véhicule ?",a:"Non"},
 {q:"Vous avez fait une coupure de 2 h. Quelle sera, au minimum, la durée (non réduite) de la période de repos à prendre à la fin de votre journée de travail pour être en règle vis-à-vis du repos journalier ?",a:"11 h"},
 {q:"La date limite de validité de la dernière visite technique est-elle inscrite sur le certificat d'immatriculation du véhicule ?",a:"Oui"},
 {q:"Vous conduisez un camion comportant une caisse réfrigérée. Quelle peut être sa largeur maximale ?",a:"2,60 m"},
 {q:"Je conduis un camion de 26 t de PTAC et de 10 t de PV. Pour emprunter une route où une barrière de dégel à 12 t avec mention « demi-charge autorisée » est en place, quel doit être le poids maximum de mon chargement ?",a:"8 t"},
 {q:"Par temps sec, ce signal me concerne ?",sign:"Panneau de danger triangulaire « ACCOTEMENT MEUBLE »",a:"Oui"},
 {q:"Lorsque le conducteur serre le frein de parc, le cylindre de frein à ressort se remplit d'air. Vrai ou Faux ?",a:"Faux"},
 {q:"Quelle est la profondeur minimale (en millimètre) des rainures principales d'un pneumatique de poids lourd ?",a:"1 mm"}
]},
{n:18,q:[
 {q:"En cas d'accident, les données du chronotachygraphe numérique peuvent-elles servir de preuve devant un tribunal ?",a:"Oui"},
 {q:"Si je perds tous les points de mon permis à la suite d'infractions commises au volant de ma voiture personnelle, pourrai-je continuer à conduire mon camion ?",a:"Non"},
 {q:"Ce signal interdit-il le dépassement à tous les véhicules dont le PTAC est supérieur à 3,5 tonnes ?",sign:"Panneau rond à bord rouge : camion doublant une voiture",a:"Non"},
 {q:"Vous conduisez sans vous arrêter depuis 8 h ce matin. Il est 12 h 40. Êtes-vous en infraction ?",a:"Oui (4 h 40 > 4 h 30)"},
 {q:"Lors d'un contrôle des temps de conduite et de repos sur la route, en plus de la journée en cours, sur quelle période devez-vous pouvoir présenter les données ?",a:"56 jours"},
 {q:"Vous conduisez un véhicule isolé à 2 essieux. Est-il possible d'être en surcharge sur l'essieu arrière si le poids réel ne dépasse pas le PTAC ?",a:"Oui"},
 {q:"Vous conduisez un camion neuf de 19 t de PTAC. À quelle vitesse êtes-vous limité sur route à sens unique prioritaire ?",a:"80 km/h"},
 {q:"Le circuit de freinage européen rend le freinage de l'essieu avant indépendant du freinage de l'essieu arrière. Vrai ou Faux ?",a:"Vrai"},
 {q:"Vous vous arrêtez pour faire le plein de carburant. Sur quel symbole devez-vous positionner le sélecteur d'activité du chronotachygraphe ?",a:"Le symbole « autres tâches » (marteaux croisés)"},
 {q:"Au-delà de quel PTAC un extincteur à poudre de 6 kg minimum, placé à l'extérieur, doit-il équiper un camion neuf ?",a:"7,5 t"}
]},
{n:19,q:[
 {q:"Sur autoroute, en cas d'incident, pour appeler les secours, vaut-il mieux utiliser une borne d'appel ou son téléphone portable ?",a:"La borne d'appel"},
 {q:"Sur une route à double sens limitée à 70 km/h, lors d'un contrôle routier, votre carte conducteur indique que vous rouliez à 80 km/h. Pouvez-vous être sanctionné ?",a:"Oui"},
 {q:"Vous rentrez chez vous le soir avec le camion de l'entreprise. Le matin, le temps de conduite pour vous rendre au dépôt est-il compté comme du temps de conduite ?",a:"Oui"},
 {q:"Après 2 heures de conduite, quelle est la durée minimale d'un premier arrêt pouvant être pris en compte comme pause ?",a:"15 min"},
 {q:"Dans le cadre d'un transport public, peut-il y avoir une lettre de voiture (avec état récapitulatif) dans le véhicule pour plusieurs voyages ?",a:"Oui"},
 {q:"Quelle est la majoration maximale autorisée du PTAC pour un véhicule équipé d'un dispositif ralentisseur pesant 400 kg ?",a:"400 kg"},
 {q:"Vous conduisez un tracteur solo de 19 t de PTAC et 38 t de PTRA. À quelle vitesse êtes-vous limité sur route non prioritaire ?",a:"60 km/h"},
 {q:"En agglomération, ce signal est-il implanté 50 mètres avant le carrefour à sens giratoire ?",sign:"Panneau de danger triangulaire « carrefour à sens giratoire »",a:"Oui"},
 {q:"Le dispositif antiblocage de roues (ABS) peut-il fonctionner en même temps que le ou les dispositifs ralentisseurs ?",a:"Oui"},
 {q:"Où doit se trouver l'extincteur obligatoire sur un véhicule isolé neuf de transport de marchandises de plus de 7,5 t : à l'intérieur ou à l'extérieur ?",a:"À l'extérieur"}
]},
{n:20,q:[
 {q:"Que signifie une plaque de couleur orange, comportant 2 rectangles sans inscription, placée à l'arrière d'un camion ?",a:"Un transport de matières dangereuses"},
 {q:"Lors d'un contrôle sur la route, est-il obligatoire de pouvoir présenter votre carte de qualification conducteur (CQC) ?",a:"Oui"},
 {q:"Hors agglomération, ce signal est-il implanté 100 mètres avant le carrefour à sens giratoire ?",sign:"Panneau de danger triangulaire « carrefour à sens giratoire »",a:"Non"},
 {q:"Vous avez interrompu votre conduite pendant 45 min. Ce temps peut-il être pris en compte pour le calcul du temps de repos journalier ?",a:"Non"},
 {q:"Dans le cadre du transport public, peut-il y avoir une seule lettre de voiture (avec état récapitulatif) dans le véhicule pour un transport comportant plusieurs destinataires dans la même journée ?",a:"Oui"},
 {q:"Vous transportez du béton liquide. Votre camion (isolé) comporte 4 essieux. Lors de la pesée avant de partir, le ticket annonce 30,5 t. Avez-vous le droit de prendre la route ?",a:"Oui (≤ 32 t)"},
 {q:"Vous conduisez un tracteur solo de 19 t de PTAC et 38 t de PTRA. À quelle vitesse êtes-vous limité sur route prioritaire ?",a:"80 km/h"},
 {q:"En principe, le ralentisseur hydraulique est situé sur … ?",a:"La transmission (l'arbre de transmission)"},
 {q:"En règle générale, quelle est la durée minimale normale (non réduite) obligatoire de repos journalier lorsque celui-ci n'est pas fractionné ?",a:"11 h"},
 {q:"Quel type d'extincteur faut-il éviter d'utiliser pour éteindre les flammes d'un feu d'hydrocarbure ?",a:"Un extincteur à eau"}
]}
];

const THEMES=[
  {id:"signal",     label:"Signalisation & panneaux",        icon:"🚧"},
  {id:"vitesse",    label:"Vitesses autorisées",             icon:"⏱️"},
  {id:"poids",      label:"Poids, essieux & PTAC",           icon:"⚖️"},
  {id:"dimensions", label:"Dimensions & chargement",         icon:"📐"},
  {id:"social",     label:"Temps de conduite & repos",       icon:"🕒"},
  {id:"chrono",     label:"Chronotachygraphe",                icon:"📊"},
  {id:"reglement",  label:"Réglementation & documents",      icon:"📄"},
  {id:"mecanique",  label:"Mécanique & technique",           icon:"🔧"},
  {id:"securite",   label:"Accidents, secours & sécurité",   icon:"🚨"}
];
const THEME_LABEL={}; THEMES.forEach(t=>THEME_LABEL[t.id]=t.label);
function classifyTheme(it){
  if(it.sign) return "signal";
  const t=it.q.toLowerCase();
  const has=arr=>arr.some(w=>t.indexOf(w)>-1);
  if(has(["km/h","vitesse"])) return "vitesse";
  if(has(["ptac","ptra","essieu","tonne"," t ","t de ptac","charge utile","poids à vide","poids réel","surcharge","charge maximale","poids indiqué"])) return "poids";
  if(has(["large","largeur","longueur","hauteur","chargement","arrimage","bâch","dépasse"])) return "dimensions";
  if(has(["chronotachygraphe","disque","ticket","symbole","carte "])) return "chrono";
  if(has(["conduite continue","pause","repos","heures précédent","semaine","interrompu votre conduite","conduisez sans vous arrêter"])) return "social";
  if(has(["licence","lettre de voiture","fimo","cqc","tir","permis","assurance","compte d'autrui","immatriculation","contrôle technique","constat"])) return "reglement";
  if(has(["moteur","frein","pneu","turbo","embrayage","batterie","direction","suspension","graiss","circuit","chaîne cinématique","bielle"])) return "mecanique";
  if(has(["accident","extincteur","secours","112","matières dangereuses","alcool","drogue","risque"])) return "securite";
  return "reglement";
}

 memo:[{t:"PRÉCAUTIONS",l:["/!\\ Gabarit + poids = bcp – d'accélération"]},{t:"Avant de dépasser",l:["Connaître son véhicule (accélération, limiteur, régulateur)","Faire /!\\ à la ≠ de vitesse & à la place nécessaire","Avertir (sonores & lumineux)","Respecter le Code de la route"]},{t:"Règles PL",l:["On n'utilise pas la 3e voie en PL","On ne dépasse pas si au – 1 voie est enneigée","Possibilité de chevaucher la ligne blanche pour dépasser les cyclistes"]},{t:"Pendant le dépassement",l:["Distances de sécurité latérales et longitudinales","Garder l'œil sur les rétroviseurs"]},{t:"Après le dépassement",l:["/!\\ à ne pas gêner le véhicule dépassé","Surveiller le rabattement dans les rétros","Signaler avec les clignotants"]},{t:"DANGERS",l:["Accrocher le véhicule dépassé","Mauvaise appréciation des distances et/ou des vitesses","Déports dus au vent"]},{t:"ÊTRE DÉPASSÉ",l:["Maintenir son allure","Ralentir si besoin et serrer à droite","Surveiller les déports dus au vent"]},{t:"DISPOSITIFS DE PROTECTION",l:["Latéraux : protègent les 2-roues et piétons d'une chute sous les roues du véhicule","Arrière : limite le risque d'encastrement par un véhicule venant de l'arrière"]}],
 sections:[
  {h:"Précautions à prendre",subs:[
   {h:"Avant le dépassement",pts:["Le dépassement d'un véhicule lourd nécessite une grande attention : gabarit imposant et faible accélération","Connaître le véhicule : accélération, limiteur et régulateur de vitesse","Tenir compte de la différence d'allure, vu la faible accélération des véhicules lourds (grande inertie)","Tenir compte de l'espace libre nécessaire à la manœuvre","Ne pas hésiter à utiliser les avertisseurs sonores et lumineux","Respecter la signalisation (panneaux, marquage) et le Code de la route","Ne pas dépasser sur la 3e voie (véhicule lourd de plus de 3,5 t ou ensemble long de plus de 7 m)","Ne pas dépasser lorsqu'au moins une voie est couverte de neige","Possibilité de dépasser un cycliste en chevauchant la ligne continue"]},
   {h:"Pendant le dépassement",pts:["Respecter les distances latérales et longitudinales","Attention particulière aux deux-roues et aux piétons","Surveiller à l'aide des rétroviseurs"]},
   {h:"Après le dépassement",pts:["Ne pas gêner le véhicule dépassé","Surveiller le rabattement avec les rétroviseurs de droite","Signaler tout rabattement avec le clignotant"]}]},
  {h:"Dangers liés au dépassement",pts:["Risque d'accrochage de l'usager dépassé","Pour cause de mauvaise appréciation des distances ou des vitesses","Pour déport dû au vent en passant d'une zone abritée à une zone ventée"]},
  {h:"Être dépassé",pts:["Maintenir son allure","Ralentir si besoin pour faciliter un dépassement mal apprécié qui bloque la circulation arrière","Surveiller un déport éventuel dû au vent"]},
  {h:"Dispositifs de protection",subs:[
   {h:"Dispositifs latéraux",pts:["Ils protègent principalement les deux-roues","En cas de chute sur la trajectoire des roues arrière du véhicule, de la remorque ou de l'ensemble"]},
   {h:"Dispositifs arrière",pts:["Ils protègent du risque d'encastrement sous le véhicule, la remorque ou l'ensemble","Ils protègent les voitures et autres véhicules venant de l'arrière"]}]}]},

{n:7,title:"Dynamique du véhicule",
 audio:"oral-7.mp3",
 plan:["Vitesse (énergie cinétique)","Centre de gravité","Force centrifuge","Adaptation dans la conduite"],
 memo:[{t:"VITESSE",l:["Lors du mouvement, le véhicule emmagasine de l'énergie : l'énergie cinétique","Ec = (m × V²) / 2","Se dissipe en freinant → transformation en chaleur","En cas de choc → par déformation du véhicule","Une des premières causes de mortalité en France !"]},{t:"CENTRE DE GRAVITÉ",l:["Point d'équilibre des forces sur le véhicule","+ le véhicule est bas, + il est stable","Défini par le constructeur","Varie selon le chargement : ballant, risque de renversement"]},{t:"FORCE CENTRIFUGE",l:["Attire un véhicule vers l'extérieur d'une courbe","Fc = (m × V²) / rayon de la courbe","Accroît le risque de renversement, notamment dans les CSG (carrefours à sens giratoire)"]},{t:"ADAPTATION À LA CONDUITE",l:["Adapter son allure & anticiper","Respecter la réglementation","Répartir, arrimer & caler le chargement","Conduite souple"]},{t:"CONDUITE D'UN TRACTEUR EN SOLO — particularité & dangers",l:["Absence de charge sur les essieux arrière","Baisse du confort","Instabilité à l'accélération","Freinage très (trop) puissant"]},{t:"Tracteur solo — précautions",l:["Respecter les limitations de vitesse","Conduite très souple"]}],
 sections:[
  {h:"Vitesse",pts:["Un véhicule en mouvement possède de l'énergie cinétique","Elle augmente proportionnellement avec sa masse et avec le carré de sa vitesse","Pour arrêter le véhicule, il faut dissiper cette énergie à l'aide des freins","Les freins la transforment en chaleur","La vitesse est l'une des premières causes d'accidents mortels"]},
  {h:"Centre de gravité",pts:["Le centre de gravité dépend de la construction du véhicule","Plus le véhicule est bas, plus il est stable","La position du centre de gravité varie avec la hauteur du chargement et son emplacement","Il influence la conduite : il peut créer des effets de ballant (oscillations longitudinales et transversales)","Il peut agrandir les trajectoires en virage et provoquer le renversement"]},
  {h:"Force centrifuge",pts:["C'est la force qui, dans un virage, s'oppose à la force centripète","Elle déporte le véhicule vers l'extérieur de la courbe","Elle varie avec le carré de la vitesse","Avec la masse du véhicule","Et avec le rayon de la courbe","Au-delà de 30 km/h dans un carrefour giratoire, le renversement est pratiquement assuré"]},
  {h:"Adaptation dans la conduite",pts:["Répartir, équilibrer et arrimer le chargement","Réduire la vitesse en fonction du chargement","En fonction de la configuration des lieux","En fonction du rayon des virages, carrefours giratoires inclus","Adopter une conduite souple","Adapter la vitesse aux circonstances : signalisation, situations, état de la route, visibilité, éclairage","Appliquer la réglementation relative aux limitations de vitesse"]},
  {h:"Limitations de vitesse (plus de 3,5 t)",pts:["Autoroute : 90 km/h","2x2 voies prioritaires : 90 km/h jusqu'à 12 t, 80 km/h au-delà de 12 t","Route prioritaire : 80 km/h","Autres routes : 80 km/h","Tenir compte du limiteur de vitesse non modifiable, contraignant lors des dépassements","Sur route mouillée, la distance de freinage est multipliée par 2 : les distances d'arrêt augmentent"]}]},

{n:8,title:"Alcool, stupéfiants, médicaments",
 audio:"oral-8.mp3",
 plan:["Alcool (effets, sanctions)","Stupéfiants (effets, sanctions)","Médicaments et fatigue"],
 memo:[{t:"ALCOOL — repères",l:["2 verres « bar » ≈ 0,5 g d'alcool / L de sang","≈ 0,25 mg d'alcool / L d'air expiré","Alcoolémie max. à jeun ≈ 30 mn ; dans un repas ≈ 1 h","↓ de 0,10 à 0,15 g/L/h","→ Pas d'astuces pour éliminer"]},{t:"Taux ↑ selon",l:["L'état de santé, le physique","Fatigue et stress"]},{t:"Effets",l:["↓ champ visuel ; vision trouble","Inattention, sommeil","Perte de mémoire, de réflexes","Troubles du comportement"]},{t:"Sanctions alcool",l:["> 0,5 g/L et < 0,8 g/L : 135 € d'amende et 6 points en –","> 0,8 g/L : 6 points, 4 500 € d'amende, suspension"]},{t:"STUPÉFIANTS — effets",l:["Mauvais contrôle des trajectoires","Sensation de sécurité","Baisse de l'attention","Temps de réaction allongé"]},{t:"Stupéfiants — risque & sanctions",l:["Risque d'accident × 1,8 avec cannabis","× 14 avec cannabis & alcool","6 points, 4 500 € d'amende, suspension","/!\\ avec alcool : 3 ans de prison + 9 000 €"]},{t:"MÉDICAMENTS",l:["Toujours lire la notice","Faire attention aux pictogrammes","Ne jamais mélanger avec alcool ou/et stupéfiants"]}],
 sections:[
  {h:"Alcool",subs:[
   {h:"Notions de base",pts:["2 verres valent environ 0,50 g/l de sang, soit 0,25 mg/l d'air expiré","Chaque verre consommé fait monter le taux d'alcool de 0,20 à 0,25 g/l","Ce taux augmente selon l'état de santé, le degré de fatigue, le stress et les caractéristiques physiques","L'alcoolémie maximale est atteinte une demi-heure après absorption à jeun","Et une heure après absorption au cours d'un repas","L'alcoolémie baisse de 0,10 à 0,15 g/l toutes les heures","Aucun truc (café salé, huile) n'élimine l'alcool plus rapidement"]},
   {h:"Effets",pts:["L'alcool agit sur le cerveau et le système nerveux","Les conditions physiques sont amoindries : champ visuel réduit, vision troublée","Inattention voire sommeil","Perte de mémoire, perte des apprentissages","Diminution des réflexes","Le comportement est modifié : prise de risque exagérée, agressivité, euphorie"]},
   {h:"Sanctions",pts:["Contravention si le taux est supérieur ou égal à 0,50 g/l de sang (0,25 mg/l d'air expiré)","Amende de 135 € et retrait de 6 points","Délit si le taux est supérieur ou égal à 0,80 g/l de sang (0,40 mg/l d'air expiré)","Retrait de 6 points et amende pouvant atteindre 4 500 €","Immobilisation du véhicule","Suspension jusqu'à 3 ans, voire annulation du permis","Peine de prison jusqu'à 2 ans"]}]},
  {h:"Stupéfiants",subs:[
   {h:"Effets",pts:["Difficultés à contrôler les trajectoires","Fausses sensations de sécurité","Baisse de l'attention et de la vigilance","Temps de réaction allongé","Le cannabis multiplie le risque d'accident par 1,8 s'il est pris seul","Par 29 lorsqu'il est combiné avec une prise d'alcool"]},
   {h:"Sanctions",pts:["Le dépistage salivaire positif entraîne les peines prévues pour le délit d'alcoolémie","Retrait de 6 points","4 500 € d'amende","Immobilisation du véhicule","Suspension de 3 ans voire annulation","Prison jusqu'à 2 ans","Sanctions aggravées si couplées à un taux d'alcool prohibé : 3 ans d'emprisonnement et 9 000 € d'amende"]}]},
  {h:"Médicaments",pts:["Avant de conduire, lire attentivement les notices ou demander conseil à son médecin","Certains médicaments sont incompatibles avec l'alcool et entraînent un risque considérable","D'autres accentuent la fatigue, facteur de nombreux accidents","Niveau 1 (jaune) : soyez prudent, ne pas conduire sans avoir lu la notice","Niveau 2 (orange) : soyez très prudent, ne pas conduire sans l'avis d'un professionnel de santé","Niveau 3 (rouge) : attention danger, ne pas conduire, demander l'avis d'un médecin"]},
  {h:"Fatigue",pts:["La somnolence empêche de rester éveillé, la fatigue fait diminuer la concentration","Un conducteur fatigué bâille souvent","Il a une nuque et un dos raides","Les yeux qui piquent","Un regard qui se fige, les paupières lourdes","La fatigue ralentit les réflexes","Elle augmente les périodes de microsommeils de 1 à 4 secondes","Elle multiplie le risque d'accident par 3","Ne pas chercher à lutter : s'arrêter et se reposer ou dormir le temps nécessaire"]}]},

{n:9,title:"Écoconduite, conduite citoyenne",
 audio:"oral-9.mp3",
 plan:["Écoconduite (règles de base)","Conduite citoyenne : bruit","Conduite citoyenne : pollution"],
 memo:[{t:"ÉCOCONDUITE",l:["Conduite écologique & économique"]},{t:"Règles de base",l:["Entretien du véhicule","/!\\ plages du compte-tours","Limiter sa vitesse","Anticiper et conduire souplement","Utiliser l'EC (énergie cinétique)","Limiter l'utilisation des équipements","Choisir son itinéraire","Préchauffer mais ne pas laisser tourner à l'arrêt","/!\\ gonflage des pneus","Tendre la bâche = aérodynamisme"]},{t:"CONDUITE CITOYENNE",l:["Conduite dans le respect des autres","/!\\ Bruit & pollution mentionnés sur la CG"]},{t:"Bruit",l:["Entretien du véhicule","/!\\ Ligne et silencieux d'échappement","Éviter les accélérations brusques et inutiles","Arrêter le moteur en stationnement","Sanctions : amendes de 4e classe + immobilisation"]},{t:"Pollution",l:["Normes Euro VI, moteur hybride, carburants alternatifs…","Équipements innovants : huiles de synthèse, déflecteurs, pneus…","Augmentation des PTRA pour les 5/6 essieux, contrôle technique annuel","Transport rail-route…"]}],
 sections:[
  {h:"Écoconduite",subs:[
   {h:"Objectif",pts:["Mieux préserver l'environnement","Économiser le carburant et le matériel"]},
   {h:"Règles de base",pts:["Veiller à ce que le véhicule soit bien entretenu","Avec une boîte manuelle, changer les rapports en respectant la plage du compte-tours","Avec une boîte automatique, utiliser les programmes en mode économique","Connaître les caractéristiques de la motorisation : couple, puissance, régime moteur optimal","Maintenir chaque fois que possible une vitesse stable","Préférer une vitesse régulée à 80 km/h plutôt qu'à 90 km/h","Garder le régime moteur au plus près du régime de couple maximal","Anticiper le trafic et conduire avec souplesse","Maintenir les distances de sécurité est primordial","Utiliser au mieux l'inertie","Limiter l'emploi de la climatisation","Choisir les trajets les mieux adaptés (GPS)","Lors des départs à froid, éviter de laisser tourner le moteur à l'arrêt","Amener progressivement moteur, pont et boîte à leur température normale : 80 °C"]}]},
  {h:"Conduite citoyenne : bruit",pts:["Maintenir en bon état le dispositif d'échappement","Il ne doit émettre ni fumées teintées ou opaques, ni gaz toxiques, corrosifs ou odorants","Ni bruits dépassant les normes admises","Éviter les accélérations intempestives en agglomération","Arrêter le moteur en stationnement","Rester vigilant si le véhicule est équipé d'un groupe frigorifique","Sanctions possibles : amendes, immobilisation, mise en fourrière"]},
  {h:"Conduite citoyenne : pollution",pts:["La pollution automobile est dangereuse pour la population et l'environnement","Les constructeurs appliquent la norme EURO VI (motorisations SCR et EGR)","Ils proposent des moteurs hybrides ou entièrement électriques","Ils utilisent des carburants alternatifs et le gaz naturel","Les équipementiers innovent : huiles de synthèse, déflecteurs, pneus économiques taille basse","Les entreprises forment leur personnel : écoconduite, FIMO et FCO","La réglementation évolue : PTRA porté à 44 t pour les 5 et 6 essieux","Contrôles techniques annuels","Certaines entreprises utilisent le transport combiné rail-route (ferroutage) ou route-voies navigables","Sanctions possibles : amendes, immobilisation, mise en fourrière"]}]},

{n:10,title:"Porte-à-faux, angles morts",
 audio:"oral-10.mp3",
 plan:["Porte-à-faux (connaissance du véhicule, situations, dangers, précautions)","Angles morts (connaissance du véhicule, situations, dangers, précautions)"],
 memo:[{t:"PORTE-À-FAUX — connaissance du véhicule",l:["Distance entre l'axe des essieux (av/ar) et l'extrémité (av/ar) du véhicule","→ Doit être connu du conducteur"]},{t:"Porte-à-faux — situations particulières",l:["/!\\ Virages et giratoires","/!\\ Manœuvres","/!\\ Passages étroits"]},{t:"Porte-à-faux — dangers & précautions",l:["Danger : accrocher des personnes ou des biens","Contrôler","Descendre","Utiliser les équipements (caméras, radars)","Se faire guider","Se placer"]},{t:"ANGLES MORTS — connaissance du véhicule",l:["Zone de non-visibilité du conducteur","→ /!\\ Angles morts beaucoup + importants en PL"]},{t:"Angles morts — situations particulières",l:["/!\\ Changement de direction","/!\\ Dépassement, rabattement","/!\\ Virages","/!\\ Manœuvres","/!\\ Passages étroits","/!\\ Freinage"]},{t:"Angles morts — dangers & précautions",l:["Danger : accrocher des personnes ou des biens","Contrôler","Descendre","Utiliser les équipements (caméras, radars)","Se faire guider","Se placer"]}],
 sections:[
  {h:"Porte-à-faux",subs:[
   {h:"Connaissance du véhicule",pts:["Le porte-à-faux est la distance entre l'axe de la roue avant ou arrière et l'extrémité correspondante du véhicule","Le conducteur doit connaître les caractéristiques de son véhicule","Y compris les longueurs des porte-à-faux avant et arrière"]},
   {h:"Situations particulières",pts:["En virage et sur les giratoires","Lors des changements de direction","Pendant les manœuvres","Lors des passages étroits","Lors des croisements entre poids lourds"]},
   {h:"Dangers",pts:["Risque de renversement des piétons ou des deux-roues","Risque d'accrochage des véhicules ou des obstacles"]},
   {h:"Précautions",pts:["Observer vers l'arrière le balayage des porte-à-faux","Le regard doit se porter à l'opposé de la direction empruntée","Utiliser sans retenue les différents rétroviseurs"]}]},
  {h:"Angles morts",subs:[
   {h:"Connaissance du véhicule",pts:["Les angles morts sont importants sur les véhicules lourds au gabarit imposant","Ils provoquent des zones invisibles vers l'arrière et sur les côtés","Le conducteur doit en tenir compte"]},
   {h:"Situations particulières",pts:["Lors des dépassements","Lors des rabattements","Lors des changements de direction","Pendant les manœuvres"]},
   {h:"Dangers",pts:["Risque de collision à l'arrière ou sur les côtés","Risques importants liés aux dépassements des deux-roues","Notamment lors des arrêts en circulation"]},
   {h:"Précautions",pts:["En cas d'absence de visibilité, sur une aire non ouverte à la circulation, descendre vérifier l'espace libre","Sur les aires de manœuvre, voire en circulation, il est prudent de se faire guider","Il existe différents types de rétroviseurs pour aider le conducteur","Rétroviseurs de type grand angle","Rétroviseurs d'accostage","Antéviseurs","Caméras balayant l'avant et l'arrière"]}]}]},

{n:11,title:"Comportement en tunnels et aux passages à niveau",
 audio:"oral-11.mp3",
 plan:["Tunnels (conduire en sécurité, arrêt, urgence, incendie)","Passages à niveau (différents types, statistiques, précautions)"],
 memo:[{t:"TUNNELS — interdictions",l:["Demi-tour","Arrêt / stationnement","/!\\ interdiction TMD"]},{t:"Tunnels — obligations",l:["Distances de sécurité","Vitesse","Feux"]},{t:"Tunnels — conseils",l:["/!\\ Carburant","Ne pas fumer","Pas de lunettes de soleil","Écouter la radio","S'aider des diodes bleues"]},{t:"En cas d'arrêt",l:["Garder les distances de sécurité","Couper le moteur","Serrer à droite","Écouter la radio"]},{t:"En cas d'urgence et/ou incendie",l:["Feux de détresse","Emplacements d'arrêts d'urgence","Utiliser les bornes SOS","Aider les personnes en difficulté","Gagner un abri ou une sortie de secours","Utiliser les extincteurs"]},{t:"PASSAGES À NIVEAU — 3 types",l:["Sans barrière : rare et dangereux","Avec barrières manuelles : très rares","À barrières automatiques"]},{t:"Statistiques",l:["Environ 18 000 PN en France","90 % des accidents dus au non-respect du Code de la route"]},{t:"Précautions",l:["Ralentir","Respecter le Code de la route","/!\\ à l'espace nécessaire pour franchir l'obstacle","Ne pas changer de rapport durant le franchissement","/!\\ Si blocage sur l'obstacle : tenter d'avancer au démarreur, casser les barrières si besoin"]}],
 sections:[
  {h:"Tunnels",subs:[
   {h:"Avant de s'engager",pts:["S'assurer de l'ouverture du tunnel","S'informer des interdictions éventuelles : Internet, société gestionnaire, panneau à message variable","S'assurer du carburant nécessaire pour traverser (Mont-Blanc : environ 12 km)"]},
   {h:"Conduire en sécurité",pts:["Ne pas fumer durant la traversée","Enlever ses éventuelles lunettes de soleil","Suivre les informations données par les équipes sur place","Écouter les consignes de sécurité : autoradio 107.7, radios locales","Allumer les feux avant d'entrer dans le tunnel","Respecter les limitations de hauteur et de largeur","Respecter les interdictions d'accès : GPL, produits inflammables et dangereux","Respecter les limitations de vitesse, parfois catégorielles","Respecter les distances de sécurité, facilitées par le balisage lumineux bleu"]},
   {h:"Arrêt dans un tunnel",pts:["Même à l'arrêt, respecter l'interdistance minimale imposée","Ne pas tenter de faire demi-tour","Lire les messages variables, écouter la radio, suivre les consignes"]},
   {h:"En cas de panne ou d'incident",pts:["Couper le moteur","Allumer les feux de détresse","Utiliser les emplacements d'arrêt prévus côté droit, à intervalles réguliers","Sinon arrêter le véhicule au plus près du trottoir","Si possible, avertir le poste de contrôle depuis les niches de sécurité SOS"]},
   {h:"En cas d'incendie (7 étapes)",pts:["1. Dès les fumées ou flammes détectées, s'arrêter sans demi-tour ni marche arrière","2. Couper le moteur","3. Allumer les feux de détresse et se vêtir du gilet haute visibilité","4. Si possible, avertir le poste de contrôle depuis les niches de sécurité SOS","5. Aider les personnes en difficulté","6. Gagner rapidement un abri vert signalé par des lampes clignotantes","7. Utiliser les extincteurs ou les lances à incendie situés dans les niches"]}]},
  {h:"Passages à niveau",subs:[
   {h:"Différents types",pts:["Il existe 3 types de passage à niveau","Le PN sans barrière : rare et plutôt dangereux","Le PN avec barrières manuelles : très rare","Le PN à fonctionnement automatique avec demi-barrières, parfois avec barrières"]},
   {h:"Données statistiques",pts:["Le réseau routier français est traversé par moins de 15 000 passages à niveau","98 % des accidents sont dus au mauvais comportement des usagers de la route","La SNCF dénombre une centaine de collisions chaque année","En 2022 : 13 tués et 22 blessés"]},
   {h:"Précautions",pts:["L'inertie, la longueur et la garde au sol des poids lourds imposent des précautions","S'assurer du niveau de dangerosité du passage à niveau","S'assurer de pouvoir dégager entièrement","Ralentir suffisamment pour pouvoir s'arrêter en toute sécurité","Éviter de se faire prendre par les barrières, sinon ne pas hésiter à les casser pour dégager","Si le véhicule reste immobilisé sur les voies, tenter de repartir au démarreur","Sinon quitter le véhicule et prévenir immédiatement la SNCF par la borne d'appel"]}]}]},

{n:12,title:"Systèmes de sécurité et d'aides à la conduite",
 audio:"oral-12.mp3",
 plan:["Définition","Exemples et rôles (sécurité, fatigue, automatisation, navigation, stationnement)","Dangers"],
 memo:[{t:"SYSTÈME DE SÉCURITÉ",l:["Permet d'éviter et/ou de minimiser un accident"]},{t:"Sécurité passive",l:["Airbag → amortit le choc","Ceinture → rend le corps solidaire du véhicule"]},{t:"Sécurité active",l:["ABR → anti-blocage des roues : permet de garder le contrôle du véhicule","AFU → aide au freinage d'urgence : permet de bénéficier instantanément de 100 % de la capacité de freinage"]},{t:"AIDE À LA CONDUITE",l:["Facilite la tâche au conducteur","Direction assistée → multiplie la force du conducteur","GPS → guidage par satellite","Vitre électrique, allumage des feux → automatisation des tâches : dispense le conducteur de la gestion des détails"]},{t:"DANGERS",l:["Baisse de l'attention et de la vigilance","Panne, incapacité du conducteur à gérer sans eux","Habitude au véhicule","Prise de risque"]}],
 sections:[
  {h:"Définition",pts:["L'aide à la conduite est un système de sécurité active d'informations ou d'assistance au conducteur","Elle lui évite de rencontrer une situation dangereuse voire l'accident","Elle le libère de tâches qui pourraient atténuer sa vigilance","Elle l'assiste dans sa perception de l'environnement : détecteur de dépassement, détecteur de risque de gel","Tout système facilitant la tâche du conducteur est une aide à la conduite","Il peut être simple et répandu comme l'ABS","Ou plus complexe comme le radar de maintien des distances"]},
  {h:"Exemples et rôles",subs:[

function oralParts(f){

  f.sections.forEach(sec=>{
    if(sec.subs) sec.subs.forEach(sub=>parts.push({parent:sec.h, h:sub.h, pts:sub.pts}));
    else parts.push({parent:null, h:sec.h, pts:sec.pts});

}

function esc(s){ return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function scoreColor(r){ return r>=0.9?"var(--ok)":r>=0.6?"var(--warn)":"var(--bad)"; }

function miniGauge(n){
  const best=store.best[n]; const has=typeof best==="number"; const ratio=has?best/10:0;
  const size=64, sw=5, r=(size-sw)/2, c=2*Math.PI*r, cx=size/2, cy=size/2, off=c*(1-ratio);
  const col=has?scoreColor(ratio):"var(--line)"; const numCol=has?"var(--ink)":"var(--muted)";
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${sw}"/>
    ${has?`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>`:""}
    <text x="${cx}" y="${cy}" class="ring__num" fill="${numCol}">${n}</text></svg>`;
}
function polar(cx,cy,r,deg){ const a=(deg-90)*Math.PI/180; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; }
function arcPath(cx,cy,r,a0,a1){
  const [x0,y0]=polar(cx,cy,r,a0), [x1,y1]=polar(cx,cy,r,a1);
  const large=Math.abs(a1-a0)>180?1:0, sweep=a1>a0?1:0;
  return `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${large} ${sweep} ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
function bigGauge(known,total){
  const ratio=total?known/total:0, size=200, sw=16, r=(size-sw)/2-6, cx=size/2, cy=size/2, col=scoreColor(ratio);
  const track=arcPath(cx,cy,r,-135,135);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="bgauge" data-ratio="${ratio}" aria-hidden="true">
    <path d="${track}" fill="none" stroke="var(--line)" stroke-width="${sw}" stroke-linecap="round"/>
    <path class="bgauge__val" d="${track}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
    <text x="${cx}" y="${cy-6}" class="bgauge__score" fill="var(--ink)">${known}<tspan class="bgauge__tot" fill="var(--muted)">/${total}</tspan></text>
    <text x="${cx}" y="${cy+28}" class="bgauge__pct" fill="${col}">${Math.round(ratio*100)} %</text></svg>`;
}

function viewSocleResult(){
  const st=state.socle, s=socleById(st.id);
  const solo=st.only!=null;
  const got=solo?(st.results[st.only]||0):s.blocks.reduce((a,b,i)=>a+(st.results[i]||0),0);
  const total=solo?blockMax(s.blocks[st.only]):socleMaxPts(s);
  const pct=Math.round(got/total*100);
  const missed=s.blocks.filter((b,i)=>(solo? i===st.only : true) && (st.results[i]||0) < blockMax(b));
  const elim=s.blocks.some((b,i)=>b.scale==="E123" && (st.results[i]||0)===0);
  let msg;
  if(elim) msg="Note E sur les essais de freinage : c'est éliminatoire à l'examen. À reprendre en priorité.";
  else if(got===total) msg="Tour du véhicule complet, rien d'oublié.";
  else if(pct>=70) msg="Bonne base. Les oublis ci-dessous sont ceux qui coûtent des points le jour J.";
  else msg="À reprendre : relis le socle en entier, puis refais le tour dans l'ordre.";
  return `
  <div class="result">
    ${elim?`<div class="examresult examresult--bad">✗ ÉLIMINATOIRE (freinage)</div>`:""}
    ${bigGauge(got,total)}
    <h2>${s.id} — ${got}/${total} points</h2>
    <p class="rmsg">${msg}</p>
    ${missed.length?`

/* ---- typage des réponses ---- */
function ansType(a){ const n=a.trim().toLowerCase(); if(n.indexOf("vrai")===0||n.indexOf("faux")===0) return "vf"; if(n.indexOf("oui")===0||n.indexOf("non")===0) return "on"; return "text"; }
function boolValue(a){ const n=a.trim().toLowerCase(); if(n.indexOf("vrai")===0)return "Vrai"; if(n.indexOf("faux")===0)return "Faux"; if(n.indexOf("oui")===0)return "Oui"; if(n.indexOf("non")===0)return "Non"; return null; }
function norm(s){ return (s==null?"":s.toString()).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim().replace(/\s+/g," "); }
function variants(a){
  const out=new Set(); const add=s=>{ const n=norm(s); if(n) out.add(n); };
  const inside=[...a.matchAll(/\(([^)]*)\)/g)].map(m=>m[1]);
  const outside=a.replace(/\([^)]*\)/g," ");
  [a,outside,...inside].forEach(add);
  [a,outside,...inside].forEach(c=>{ c.split(/ ou |,|\/|–|—/i).forEach(p=>{ add(p); add(p.replace(/^\s*(le|la|les|l['’]|un|une|des|du|de|au|aux)\s+/i,"")); }); });
  const nums=a.match(/\d+[.,]?\d*/g); if(nums) nums.forEach(x=>{ const n=norm(x); if(n) out.add(n); });
  return [...out].filter(Boolean);
}
function softMatch(input,a){
  const t=norm(input); if(!t) return false;
  const vs=variants(a);
  if(vs.indexOf(t)>-1) return true;
  for(const v of vs){ if(v.length>=3 && (t===v || t.indexOf(v)>-1 || v.indexOf(t)>-1)) return true; }
  const dn=(t.match(/\d+/g)||[]).join(" "), da=(norm(a).match(/\d+/g)||[]).join(" ");
  if(dn && dn===da) return true;
  return false;
}
function formatRemain(deadline){ const r=Math.max(0,deadline-Date.now()); const m=Math.floor(r/60000), sec=Math.floor((r%60000)/1000); return String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0"); }
function kbdHint(type,revealed,examMode){
  if(!revealed){
    if(type==="text") return `<b>Entrée</b> valider · <span class="key">←</span> <span class="key">→</span> naviguer · <span class="key">Échap</span> menu`;
    return `<span class="key">1</span> ${type==="vf"?"Vrai":"Oui"} · <span class="key">2</span> ${type==="vf"?"Faux":"Non"} · <span class="key">←</span> <span class="key">→</span> · <span class="key">Échap</span> menu`;
  }
  if(type==="text" && !examMode) return `<span class="key">1</span> j'avais juste · <span class="key">2</span> à revoir · <span class="key">←</span> revenir · <span class="key">Échap</span> menu`;
  return `<span class="key">Espace</span> suivante · <span class="key">←</span> revenir · <span class="key">Échap</span> menu`;
}
function renderAnswered(s,it,type){
  const auto = (type==="vf" || type==="on" || (type==="text" && s.examMode));
  if(auto){
    const ok=s.correctAuto;
    return `
      ${ok?`<div class="fb fb--ok">✓ Bonne réponse</div>`:`<div class="fb fb--bad">✗ Mauvaise réponse</div>`}
      <div class="answer">
        <div class="given">Ta réponse : <b>${esc(s.given||"—")}</b></div>
        <div class="answer__lab">Réponse</div>
        <div class="answer__a">${esc(it.a)}</div>
        ${it.note?`<div class="answer__note">${esc(it.note)}</div>`:""}
      </div>
      <div class="reveal"><button class="btn btn--primary" data-action="skip">Suivante → <span class="key">Espace</span></button></div>`;
  }
  const hint=s.correctAuto?`<div class="hint">Ta réponse semble correcte — confirme.</div>`:"";
  return `
    <div class="answer">
      <div class="given">Ta réponse : <b>${esc(s.given||"—")}</b></div>
      <div class="answer__lab">Réponse attendue</div>
      <div class="answer__a">${esc(it.a)}</div>
      ${it.note?`<div class="answer__note">${esc(it.note)}</div>`:""}
      ${hint}
      <div class="grade">
        <button class="btn btn--ok ${s.correctAuto?"suggested":""}" data-action="grade" data-grade="known">✓ J'avais juste <span class="key">1</span></button>
        <button class="btn btn--bad" data-action="grade" data-grade="review">✗ À revoir <span class="key">2</span></button>
      </div>
    </div>`;
}

  return `

function viewResult(){
  const s=state.session;
  const vals=Object.values(s.results);
  const known=vals.filter(v=>v==="known").length;
  const total=s.items.length;
  const ratio=total?known/total:0;
  const reviews=s.items.filter(it=>s.results[it.key]==="review");
  const isExamOff=s.kind==="exam-officiel";
  const passed=known>=5;
  const examBadge=isExamOff?`<div class="examresult ${passed?"examresult--ok":"examresult--bad"}">${passed?"✓ ADMIS":"✗ ÉLIMINATOIRE"}${s.timedOut?" · temps écoulé":""}</div>`:"";
  let msg;
  if(isExamOff){
    msg = passed
      ? (known===10?"Sans-faute, dans les conditions réelles de l'examen.":"Seuil de réussite atteint (≥ 5/10).")
      : "Moins de 5 bonnes réponses sur 10 : éliminatoire dans les conditions réelles. Reprends cette fiche.";
  } else if(ratio===1) msg="Sans-faute. Cette série est acquise.";
  else if(ratio>=0.8) msg="Solide. Reprends les quelques questions en rouge et ce sera parfait.";
  else if(ratio>=0.5) msg="En bonne voie. Concentre-toi sur la pile « à revoir ».";
  else msg="À retravailler. Relis la fiche en mode liste, puis refais la série.";
  const revList=reviews.length?`
    <div class="rev-head"><div class="eyebrow">À revoir (${reviews.length})</div></div>
    ${reviews.map(it=>`
      <div class="list-item open" style="cursor:default">
        <div class="li-q"><span class="li-n">${it.idx}</span><span class="li-qt">${esc(it.q)}${s.kind!=="fiche"&&s.kind!=="exam-officiel"?` <span style="color:var(--faint)">· F${it.fiche}</span>`:""}</span></div>
        <div class="li-a"><span class="li-al">Réponse</span>${esc(it.a)}</div>
      </div>`).join("")}`:`<p class="rmsg" style="color:var(--ok)">Rien à revoir dans cette série 👍</p>`;
  const restartLabel = s.kind==="fiche"?"Recommencer la fiche":isExamOff?"Nouvel examen":"Relancer";
  return `
  <div class="result">
    ${examBadge}
    ${bigGauge(known,total)}
    <h2>${esc(sessionTitle(s))} — ${known}/${total}</h2>
    <p class="rmsg">${msg}</p>
    ${revList}
    <div class="actions">
      <button class="btn btn--primary" data-action="restart">${restartLabel}</button>
      ${reviews.length?`<button class="btn" data-action="restart-review-only">Refaire les erreurs</button>`:""}
      <button class="btn btn--ghost" data-action="menu">Retour au menu</button>
    </div>
  </div>`;
}

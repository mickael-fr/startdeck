  }
}

/* ============================= SESSIONS ============================= */
function startFiche(n,forceMode){
  stopExamTimer();
  const mode=forceMode||state.tileMode;
  if(mode==="list"){ state.session={kind:"fiche", fiche:n}; state.screen="list"; render(); return; }
  state.session={kind:"fiche", fiche:n, items:FICHES.find(f=>f.n===n).q.map((it,i)=>({fiche:n,idx:i+1,key:n+"-"+(i+1),q:it.q,a:it.a,sign:it.sign,note:it.note})), pos:0, revealed:false, results:{}};
  state.screen="study"; render();
}
function startRandom(){ stopExamTimer(); state.session={kind:"random", fiche:null, items:shuffle(ITEMS.slice()), pos:0, revealed:false, results:{}}; state.screen="study"; render(); }
function startExam(){ stopExamTimer(); state.session={kind:"exam", fiche:null, items:shuffle(ITEMS.slice()).slice(0,10), pos:0, revealed:false, results:{}}; state.screen="study"; render(); }
function startSigns(){ stopExamTimer(); const items=shuffle(ITEMS.filter(x=>x.sign).slice()); state.session={kind:"signs", fiche:null, items, pos:0, revealed:false, results:{}}; state.screen="study"; render(); }
function startTheme(id){ stopExamTimer(); const items=shuffle(ITEMS.filter(x=>x.theme===id).slice()); if(!items.length) return; state.session={kind:"theme", themeId:id, fiche:null, items, pos:0, revealed:false, results:{}}; state.screen="study"; render(); }
function startReview(){
  stopExamTimer();
  const items=ITEMS.filter(x=>store.review.has(x.key));
  if(!items.length) return;
  state.session={kind:"review", fiche:null, items:shuffle(items), pos:0, revealed:false, results:{}}; state.screen="study"; render();
}
function startExamOfficiel(){
  stopExamTimer();
  const n=1+Math.floor(Math.random()*FICHES.length);
  const items=FICHES.find(f=>f.n===n).q.map((it,i)=>({fiche:n,idx:i+1,key:n+"-"+(i+1),q:it.q,a:it.a,sign:it.sign,note:it.note}));
  state.session={kind:"exam-officiel", fiche:n, items, pos:0, revealed:false, results:{}, examMode:true, deadline:Date.now()+6*60*1000, timedOut:false};
  state.screen="study"; render();
  startExamTimer();
}
function stopExamTimer(){ if(examTimer){ clearInterval(examTimer); examTimer=null; } }
function startExamTimer(){
  stopExamTimer();
  examTimer=setInterval(()=>{
    const s=state.session;
    if(!s || !s.examMode){ stopExamTimer(); return; }
    const remain=s.deadline-Date.now();
    const el=document.getElementById("examclock");
    if(el){
      el.textContent=formatRemain(s.deadline);
      el.classList.toggle("clock--danger", remain<60000);
    }
    if(remain<=0){
      stopExamTimer();
      s.timedOut=true;
      s.items.forEach(it=>{ if(!(it.key in s.results)){ s.results[it.key]="review"; store.review.add(it.key); store.seen[it.key]="review"; } });
      save();
      state.screen="result"; render();
    }
  },250);
}

function resetCard(s){ s.revealed=false; s.given=""; s.correctAuto=null; }
function record(key,val){ state.session.results[key]=val; store.seen[key]=val; if(val==="review") store.review.add(key); else store.review.delete(key); save(); }

function answerBool(val){
  const s=state.session, it=s.items[s.pos];
  s.given=val; s.revealed=true;
  s.correctAuto=(val===boolValue(it.a));
  record(it.key, s.correctAuto?"known":"review");
  render();
}
function validateText(){
  const s=state.session, it=s.items[s.pos];
  const inp=document.getElementById("txtin");
  s.given=inp?inp.value.trim():"";
  s.revealed=true;
  s.correctAuto=softMatch(s.given, it.a);
  if(s.examMode) record(it.key, s.correctAuto?"known":"review");
  render();
}
function grade(val){
  const s=state.session, it=s.items[s.pos];
  record(it.key, val);
  advance();
}
function advance(){
  const s=state.session;
  if(s.pos < s.items.length-1){ s.pos++; resetCard(s); render(); }
  else finalize();
}
function back(){
  const s=state.session;
  if(s.pos>0){ s.pos--; resetCard(s); render(); }
}
function finalize(){
  stopExamTimer();
  const s=state.session;
  if(s.kind==="fiche" || s.kind==="exam-officiel"){
    const known=Object.values(s.results).filter(v=>v==="known").length;
    store.best[s.fiche]=Math.max(store.best[s.fiche]||0, known);
    save();
  }
  state.screen="result"; render();
}
function openZoom(src){
  closeZoom();
  const w=document.createElement("div");
  w.className="zoomwrap"; w.id="zoomwrap";
  w.innerHTML=`<button class="zclose" type="button">Fermer ✕</button><img src="${src}" alt="Agrandissement">`;
  w.addEventListener("click", closeZoom);
  document.body.appendChild(w);
}
function closeZoom(){ const w=document.getElementById("zoomwrap"); if(w) w.remove(); }

function toMenu(){ stopExamTimer(); ttsStop(); stopAudio(); state.screen="menu"; state.session=null; render(); }

/* ---------- Sessions orales ---------- */
function oralOpen(n){ stopExamTimer(); state.oral={fiche:n, partIdx:0, revealed:false, ticks:new Set(), planTicks:new Set(), chain:null}; state.screen="oral-fiche"; render(); }
function oralStartPlan(){ const n=state.oral.fiche; state.oral={fiche:n, partIdx:0, revealed:false, ticks:new Set(), planTicks:new Set(), chain:state.oral.chain}; state.screen="oral-plan"; render(); }
function oralStartParts(){ const o=state.oral; o.partIdx=0; o.revealed=false; o.ticks=new Set(); state.screen="oral-part"; render(); }
function oralDraw(){ const n=1+Math.floor(Math.random()*ORAL.length); oralOpen(n); state.screen="oral-plan"; render(); }
function oralNext(){
  const o=state.oral, f=ORAL.find(x=>x.n===o.fiche), parts=oralParts(f);
  if(o.partIdx < parts.length-1){ o.partIdx++; o.revealed=false; state.screen="oral-part"; render(); }
  else oralFinish();
}
function oralPrev(){ const o=state.oral; if(o.partIdx>0){ o.partIdx--; o.revealed=false; render(); } }
function oralFinish(){
  const o=state.oral, f=ORAL.find(x=>x.n===o.fiche);
  const total=oralTotalPts(f), pct=total?Math.round(o.ticks.size/total*100):0;
  store.oral[f.n]=Math.max(store.oral[f.n]||0, pct);
  save();
  if(o.chain && o.chain.length){ const nx=o.chain.shift(); const rest=o.chain; oralOpen(nx); state.oral.chain=rest; state.screen="oral-plan"; render(); return; }
  state.screen="oral-result"; render();
}
function oralPlansChain(){
  const order=shuffle(ORAL.map(f=>f.n));
  const first=order.shift();
  oralOpen(first); state.oral.chain=order; state.oral.planOnly=true; state.screen="oral-plan"; render();
}
function oralPlanNext(){
  const o=state.oral;
  if(o.chain && o.chain.length){
    const nx=o.chain.shift(); const rest=o.chain;
    oralOpen(nx); state.oral.chain=rest; state.oral.planOnly=true; state.screen="oral-plan"; render();
  } else { state.tab="oral"; state.screen="menu"; render(); }
}

function exportProgress(){
  const payload={version:1, exportedAt:new Date().toISOString(), best:store.best, review:[...store.review], seen:store.seen, oral:store.oral, socle:store.socle, conduite:store.conduite};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download="progression-permis-c.json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function importProgress(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      const nb=data.best||{}, nr=(data.review||[]), ns=data.seen||{};
      Object.keys(nb).forEach(k=>{ store.best[k]=Math.max(store.best[k]||0, nb[k]); });
      nr.forEach(k=>store.review.add(k));
      Object.keys(ns).forEach(k=>{ if(!store.seen[k] || (ns[k]==="known" && store.seen[k]!=="known")) store.seen[k]=ns[k]; });
      save();
      alert("Progression importée avec succès.");
      render();
    }catch(e){ alert("Fichier invalide — vérifie que c'est bien un export de cet outil."); }
  };
  reader.readAsText(file);
}

/* ============================= LECTURE VOCALE ============================= */
const TTS={
  queue:[], i:0, playing:false, paused:false, rate:1, ctx:null, supported:("speechSynthesis" in window),
  voice:null, voiceReady:false
};
function ttsPickVoice(){
  if(!TTS.supported) return null;
  const vs=speechSynthesis.getVoices()||[];
  if(!vs.length) return null;
  const fr=vs.filter(v=>/^fr(-|_)?/i.test(v.lang||""));
  const pool=fr.length?fr:vs;
  // préférer une voix française locale et « premium » si disponible
  const pref=pool.find(v=>/Amelie|Am\u00e9lie|Thomas|Audrey|Marie|Google fran|Microsoft/i.test(v.name))
          || pool.find(v=>v.localService) || pool[0];
  TTS.voice=pref||null; TTS.voiceReady=true;
  return TTS.voice;
}
if(typeof speechSynthesis!=="undefined"){
  ttsPickVoice();
  speechSynthesis.onvoiceschanged=()=>{ ttsPickVoice(); };
}
function stopAudio(){ const a=document.getElementById("oralAudio"); if(a){ try{ a.pause(); }catch(e){} } }
function ttsStop(){
  if(!TTS.supported) return;
  try{ speechSynthesis.cancel(); }catch(e){}
  TTS.queue=[]; TTS.i=0; TTS.playing=false; TTS.paused=false;
  ttsSync();
}
function ttsSpeakNext(){
  if(!TTS.playing || TTS.i>=TTS.queue.length){
    if(TTS.i>=TTS.queue.length){ TTS.playing=false; TTS.paused=false; ttsSync(); }
    return;
  }
  const item=TTS.queue[TTS.i];
  const u=new SpeechSynthesisUtterance(item.text);
  u.lang="fr-FR"; u.rate=TTS.rate; u.pitch=1;
  if(TTS.voice) u.voice=TTS.voice;
  u.onend=()=>{ if(!TTS.playing) return; TTS.i++; ttsHighlight(); ttsSpeakNext(); };
  u.onerror=()=>{ if(!TTS.playing) return; TTS.errors=(TTS.errors||0)+1; TTS.i++;
    if(TTS.errors>=3 && Date.now()-TTS.started<1500){ TTS.playing=false; ttsSync();
      const st=document.getElementById("ttsState");
      if(st) st.textContent="aucune voix installée"; return; }
    ttsSpeakNext(); };
  try{ speechSynthesis.speak(u); }catch(e){ TTS.playing=false; ttsSync(); }
  ttsHighlight();
}
function ttsPlay(items, rate){
  if(!TTS.supported) return;
  ttsStop();
  TTS.errors=0; TTS.started=Date.now();
  if(typeof rate==="number") TTS.rate=rate;
  TTS.queue=items; TTS.i=0; TTS.playing=true; TTS.paused=false;
  if(!TTS.voiceReady) ttsPickVoice();
  ttsSpeakNext(); ttsSync();
}
function ttsToggle(){
  if(!TTS.supported || !TTS.playing) return;
  if(TTS.paused){ try{ speechSynthesis.resume(); }catch(e){} TTS.paused=false; }
  else { try{ speechSynthesis.pause(); }catch(e){} TTS.paused=true; }
  ttsSync();
}
function ttsSetRate(r){
  TTS.rate=r;
  if(TTS.playing){ // relancer à partir de l'élément courant pour appliquer la vitesse
    const rest=TTS.queue.slice(TTS.i);
    const idx=TTS.i;
    ttsStop(); TTS.queue=TTS.queue; // reset
    TTS.queue=rest; TTS.i=0; TTS.playing=true; TTS.paused=false; TTS.rate=r;
    ttsSpeakNext();
  }
  ttsSync();
}
function ttsHighlight(){
  document.querySelectorAll("[data-tts-i]").forEach(el=>{
    el.classList.toggle("tts-on", TTS.playing && +el.getAttribute("data-tts-i")===TTS.i);
  });
  const cur=document.querySelector(".tts-on");
  if(cur && TTS.playing) { try{ cur.scrollIntoView({block:"center", behavior:"smooth"}); }catch(e){} }
}
function ttsSync(){
  const bar=document.getElementById("ttsbar");
  if(!bar) return;
  bar.classList.toggle("is-playing", TTS.playing);
  const b=document.getElementById("ttsToggle");
  if(b) b.textContent = TTS.playing ? (TTS.paused?"▶︎ Reprendre":"⏸ Pause") : "▶︎ Écouter";
  const st=document.getElementById("ttsState");
  if(st) st.textContent = TTS.playing ? (TTS.paused?"en pause":`${Math.min(TTS.i+1,TTS.queue.length)} / ${TTS.queue.length}`) : "prêt";
  document.querySelectorAll("[data-rate]").forEach(el=>{
    el.setAttribute("aria-pressed", String(parseFloat(el.getAttribute("data-rate"))===TTS.rate));
  });
  ttsHighlight();
}
/* Construit la liste des phrases d'une fiche orale */
function oralSpeech(f, withPlan){
  const items=[];
  items.push({text:`Fiche ${f.n}. ${f.title}.`});
  if(withPlan && f.plan && f.plan.length){
    items.push({text:"Plan de la fiche."});
    f.plan.forEach(p=>items.push({text:p}));
  }
  oralParts(f).forEach(part=>{
    items.push({text:(part.parent?part.parent+". ":"")+part.h+"."});
    part.pts.forEach(x=>items.push({text:x}));
  });
  return items;
}
function ttsBarHTML(){
  if(!TTS.supported) return `<div class="ttsbar"><span class="tts-lab">Lecture vocale non disponible sur ce navigateur.</span></div>`;
  return `<div class="ttsbar" id="ttsbar">
    <button class="btn btn--primary btn--sm" id="ttsToggle" data-action="tts-toggle">▶︎ Écouter</button>
    <button class="btn btn--ghost btn--sm" data-action="tts-stop">■ Stop</button>
    <span class="tts-lab">Vitesse</span>
    <span class="seg seg--rate">
      <button data-action="tts-rate" data-rate="0.8" aria-pressed="${TTS.rate===0.8}">0,8×</button>
      <button data-action="tts-rate" data-rate="1" aria-pressed="${TTS.rate===1}">1×</button>
      <button data-action="tts-rate" data-rate="1.25" aria-pressed="${TTS.rate===1.25}">1,25×</button>
    </span>
    <span class="tts-state" id="ttsState">prêt</span>
  </div>`;
}

  <div class="nav">
    <div class="side"><button class="btn btn--ghost btn--sm" data-action="conduite-prev" ${st.pos===0?"disabled":""}>← Précédent</button></div>
    <div class="side"><button class="btn btn--ghost btn--sm" data-action="menu">Menu</button></div>
  </div>
  <div class="kbd">${st.revealed?`<span class="key">1</span> dit · <span class="key">2</span> oublié`:`<span class="key">Espace</span> dévoiler`} · <span class="key">←</span> <span class="key">→</span> · <span class="key">Échap</span> menu</div>`;
}

function viewConduiteResult(){
  const st=state.conduite;
  const got=CONDUITE.steps.reduce((a,s,i)=>a+(st.results[i]||0),0);
  const total=CONDUITE.steps.length;
  const missed=CONDUITE.steps.filter((s,i)=>!(st.results[i]||0));
  const msg = got===total ? "Les 7 points enchaînés sans oubli."
            : got>=5 ? "Presque : reprends les points manqués ci-dessous."
            : "À retravailler — relis la liste complète puis recommence.";
  return `
  <div class="result">
    ${bigGauge(got,total)}
    <h2>Avant le départ — ${got}/${total} points</h2>
    <p class="rmsg">${msg}</p>
    ${missed.length?`
      <div class="rev-head"><div class="eyebrow">Oubliés (${missed.length})</div></div>
      ${missed.map(s=>`<div class="list-item open" style="cursor:default">
        <div class="li-q"><span class="li-n">${esc(s.n)}</span><span class="li-qt"><b>${esc(s.h)}</b></span></div>
        <div class="li-a"><ul class="opts" style="margin-top:2px">${s.pts.map(x=>`<li style="font-size:14px">${esc(x)}</li>`).join("")}</ul></div>
      </div>`).join("")}`:`<p class="rmsg" style="color:var(--ok)">Aucun oubli 👍</p>`}
    <div class="actions">
      <button class="btn btn--primary" data-action="conduite-start">Recommencer</button>
      <button class="btn btn--ghost" data-action="menu">Retour au menu</button>
    </div>
  </div>`;
}

function conduiteStart(){ stopExamTimer(); state.conduite={pos:0, revealed:false, results:{}}; state.screen="conduite-run"; render(); }
function conduiteReveal(){ state.conduite.revealed=true; render(); }
function conduiteGrade(v){ const st=state.conduite; st.results[st.pos]=parseInt(v,10); conduiteNext(); }
function conduiteNext(){
  const st=state.conduite;
  if(st.pos < CONDUITE.steps.length-1){ st.pos++; st.revealed=false; render(); }
  else { const got=CONDUITE.steps.reduce((a,s,i)=>a+(st.results[i]||0),0);
    store.conduite=Math.max(store.conduite||0, got); save();
    state.screen="conduite-result"; render(); }
}
function conduitePrev(){ const st=state.conduite; if(st.pos>0){ st.pos--; st.revealed=false; render(); } }

/* ---------- Sessions vérifications ---------- */
function socleOpen(id){ stopExamTimer(); state.socle={id:id, pos:0, revealed:false, results:{}}; state.screen="socle-home"; render(); }
function socleStart(){ const st=state.socle; st.pos=0; st.revealed=false; st.results={}; st.only=null; state.screen="socle-run"; render(); }
function socleDraw(){
  const st=state.socle, s=socleById(st.id);
  const i=Math.floor(Math.random()*s.blocks.length);
  st.pos=i; st.revealed=false; st.results={}; st.only=i;
  state.screen="socle-run"; render();
}
function socleReveal(){ state.socle.revealed=true; render(); }
function socleGrade(v){ const st=state.socle; st.results[st.pos]=parseInt(v,10); socleNext(); }
function socleNext(){
  const st=state.socle, s=socleById(st.id);
  if(st.only!=null){ socleFinish(); return; }
  if(st.pos < s.blocks.length-1){ st.pos++; st.revealed=false; render(); }
  else socleFinish();
}
function soclePrev(){ const st=state.socle; if(st.pos>0){ st.pos--; st.revealed=false; render(); } }
function socleFinish(){
  const st=state.socle, s=socleById(st.id);
  let got, max;
  if(st.only!=null){ got=st.results[st.only]||0; max=blockMax(s.blocks[st.only]); }
  else { got=s.blocks.reduce((a,b,i)=>a+(st.results[i]||0),0); max=socleMaxPts(s); }
  const pct=Math.round(got/max*100);
  store.socle[s.id]=Math.max(store.socle[s.id]||0, pct);
  save();
  state.screen="socle-result"; render();
}

/* ============================= ÉVÉNEMENTS ============================= */
document.getElementById("app").addEventListener("click", e=>{
  const t=e.target.closest("[data-action]"); if(!t) return;
  const a=t.dataset.action;
  if(a==="set-mode"){ state.tileMode=t.dataset.mode; render(); }
  else if(a==="set-tab"){ state.tab=t.dataset.tab; state.screen="menu"; stopExamTimer(); render(); }
  else if(a==="oral-open"){ oralOpen(+t.dataset.fiche); }
  else if(a==="oral-draw"){ oralDraw(); }
  else if(a==="oral-plans"){ oralPlansChain(); }
  else if(a==="oral-start-plan"){ oralStartPlan(); }
  else if(a==="oral-start-parts"){ oralStartParts(); }
  else if(a==="oral-read"){ state.screen="oral-read"; render(); }
  else if(a==="oral-memo"){ state.screen="oral-memo"; render(); }
  else if(a==="oral-listen"){ ttsStop(); state.screen="oral-listen"; render(); }
  else if(a==="tts-toggle"){ if(!TTS.playing){ const f=ORAL.find(x=>x.n===state.oral.fiche); ttsPlay(oralSpeech(f,true)); } else ttsToggle(); }
  else if(a==="tts-stop"){ ttsStop(); }
  else if(a==="tts-rate"){ ttsSetRate(parseFloat(t.dataset.rate)); }
  else if(a==="aud-rate"){
    const r=parseFloat(t.dataset.rate), a2=document.getElementById("oralAudio");
    if(a2) a2.playbackRate=r;
    document.querySelectorAll("[data-action=\"aud-rate\"]").forEach(el=>el.setAttribute("aria-pressed", String(parseFloat(el.dataset.rate)===r)));
  }
  else if(a==="socle-open"){ socleOpen(t.dataset.socle); }
  else if(a==="socle-start"){ socleStart(); }
  else if(a==="socle-draw"){ socleDraw(); }
  else if(a==="conduite-start"){ conduiteStart(); }
  else if(a==="conduite-reveal"){ conduiteReveal(); }
  else if(a==="conduite-grade"){ conduiteGrade(t.dataset.grade); }
  else if(a==="conduite-prev"){ conduitePrev(); }
  else if(a==="zoom-open"){ openZoom(t.getAttribute("src")); }
  else if(a==="socle-read"){ state.screen="socle-home"; render(); }
  else if(a==="socle-reveal"){ socleReveal(); }
  else if(a==="socle-grade"){ socleGrade(t.dataset.grade); }
  else if(a==="socle-prev"){ soclePrev(); }
  else if(a==="oral-reveal-plan"){ state.oral.revealed=true; render(); }
  else if(a==="oral-tick-plan"){ const i=+t.dataset.i; const s=state.oral.planTicks; if(s.has(i))s.delete(i); else s.add(i); render(); }
  else if(a==="oral-tick-plan-all"){ const f=ORAL.find(x=>x.n===state.oral.fiche); f.plan.forEach((_,i)=>state.oral.planTicks.add(i)); render(); }
  else if(a==="oral-to-parts"){ oralStartParts(); }
  else if(a==="oral-plan-next"){ oralPlanNext(); }
  else if(a==="oral-reveal"){ state.oral.revealed=true; render(); }
  else if(a==="oral-tick"){ const k=state.oral.partIdx+":"+t.dataset.i; const s=state.oral.ticks; if(s.has(k))s.delete(k); else s.add(k); render(); }
  else if(a==="oral-tick-all"){ const f=ORAL.find(x=>x.n===state.oral.fiche); const p=oralParts(f)[state.oral.partIdx]; p.pts.forEach((_,i)=>state.oral.ticks.add(state.oral.partIdx+":"+i)); render(); }
  else if(a==="oral-tick-none"){ const f=ORAL.find(x=>x.n===state.oral.fiche); const p=oralParts(f)[state.oral.partIdx]; p.pts.forEach((_,i)=>state.oral.ticks.delete(state.oral.partIdx+":"+i)); render(); }
  else if(a==="oral-next"){ oralNext(); }
  else if(a==="oral-prev"){ oralPrev(); }
  else if(a==="open-fiche"){ startFiche(+t.dataset.fiche, t.dataset.force); }
  else if(a==="start-random"){ startRandom(); }
  else if(a==="start-exam"){ startExam(); }
  else if(a==="start-exam-off"){ startExamOfficiel(); }
  else if(a==="start-signs"){ startSigns(); }
  else if(a==="start-theme"){ startTheme(t.dataset.theme); }
  else if(a==="start-review"){ startReview(); }
  else if(a==="answer-bool"){ answerBool(t.dataset.val); }
  else if(a==="validate-text"){ validateText(); }
  else if(a==="grade"){ grade(t.dataset.grade); }
  else if(a==="skip"){ advance(); }
  else if(a==="prev"){ back(); }
  else if(a==="menu"){ toMenu(); }
  else if(a==="to-list"){ stopExamTimer(); state.session={kind:"fiche", fiche:+t.dataset.fiche}; state.screen="list"; render(); }
  else if(a==="toggle-item"){ t.classList.toggle("open"); }
  else if(a==="reveal-all"){ document.querySelectorAll(".list-item").forEach(x=>x.classList.add("open")); }
  else if(a==="hide-all"){ document.querySelectorAll(".list-item").forEach(x=>x.classList.remove("open")); }
  else if(a==="restart"){
    const s=state.session;
    if(s.kind==="fiche") startFiche(s.fiche,"cards");
    else if(s.kind==="random") startRandom();
    else if(s.kind==="exam") startExam();
    else if(s.kind==="exam-officiel") startExamOfficiel();
    else if(s.kind==="signs") startSigns();
    else if(s.kind==="theme") startTheme(s.themeId);
    else startReview();
  }
  else if(a==="restart-review-only"){ stopExamTimer(); const s=state.session; const items=s.items.filter(it=>s.results[it.key]==="review"); state.session={kind:s.kind==="fiche"?"fiche":s.kind, fiche:s.kind==="fiche"?s.fiche:null, themeId:s.themeId, items:shuffle(items.slice()), pos:0, revealed:false, results:{}}; state.screen="study"; render(); }
  else if(a==="reset"){ if(confirm("Effacer toute la progression (écrit et oral) ?")){ stopExamTimer(); store={best:{},review:new Set(),seen:{},oral:{}}; save(); render(); } }
  else if(a==="export-data"){ exportProgress(); }
  else if(a==="import-data"){ const f=document.getElementById("importFile"); if(f) f.click(); }
});

document.getElementById("app").addEventListener("change", e=>{
  if(e.target && e.target.id==="importFile"){
    const f=e.target.files && e.target.files[0];
    if(f) importProgress(f);
    e.target.value="";
  }
});

document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && document.getElementById("zoomwrap")){ e.preventDefault(); closeZoom(); return; }
  if(state.screen==="conduite-run"){
    const st=state.conduite;
    if(e.key==="Escape"){ e.preventDefault(); toMenu(); return; }
    if(!st.revealed){ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); conduiteReveal(); return; } }
    else { if(e.key==="1"){ e.preventDefault(); conduiteGrade("1"); return; } if(e.key==="2"){ e.preventDefault(); conduiteGrade("0"); return; } }
    if(e.key==="ArrowRight"){ e.preventDefault(); conduiteNext(); return; }
    if(e.key==="ArrowLeft"){ e.preventDefault(); conduitePrev(); return; }
    return;
  }
  if(state.screen==="socle-run"){
    const st=state.socle;
    if(e.key==="Escape"){ e.preventDefault(); toMenu(); return; }
    if(!st.revealed){ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); socleReveal(); return; } }
    else {
      const bb=socleById(st.id).blocks[st.pos];
      if(bb.scale==="E123"||bb.scale==="0123"){ if(["0","1","2","3"].indexOf(e.key)>-1){ e.preventDefault(); socleGrade(e.key); return; } }
      else { if(e.key==="1"){ e.preventDefault(); socleGrade("1"); return; } if(e.key==="2"){ e.preventDefault(); socleGrade("0"); return; } }
    }
    if(e.key==="ArrowRight"){ e.preventDefault(); socleNext(); return; }
    if(e.key==="ArrowLeft"){ e.preventDefault(); soclePrev(); return; }
    return;
  }
  if(state.screen!=="study"){
    if(e.key==="Escape" && state.screen!=="menu"){ e.preventDefault(); toMenu(); }
    return;
  }
  const s=state.session, it=s.items[s.pos], type=ansType(it.a);
  const inInput=document.activeElement && document.activeElement.id==="txtin";
  if(e.key==="Escape"){ e.preventDefault(); toMenu(); return; }
  if(inInput){ if(e.key==="Enter"){ e.preventDefault(); validateText(); } return; }
  if(!s.revealed){
    if(type==="vf"){ if(e.key==="1"){e.preventDefault();answerBool("Vrai");return;} if(e.key==="2"){e.preventDefault();answerBool("Faux");return;} }
    else if(type==="on"){ if(e.key==="1"){e.preventDefault();answerBool("Oui");return;} if(e.key==="2"){e.preventDefault();answerBool("Non");return;} }
    if(e.key==="ArrowRight"){e.preventDefault();advance();return;}
    if(e.key==="ArrowLeft"){e.preventDefault();back();return;}
  } else {
    const autoGraded=(type==="vf"||type==="on"||(type==="text"&&s.examMode));
    if(!autoGraded){
      if(e.key==="1"){e.preventDefault();grade("known");return;}
      if(e.key==="2"){e.preventDefault();grade("review");return;}
    } else {
      if(e.key===" "||e.key==="Enter"){e.preventDefault();advance();return;}
    }
    if(e.key==="ArrowRight"){e.preventDefault();advance();return;}
    if(e.key==="ArrowLeft"){e.preventDefault();back();return;}
  }
});

render();

/* ============================= PWA ============================= */
(function(){
  // Raccourcis du manifeste : ?go=exam | oral | verif
  try{
    var go=new URLSearchParams(location.search).get("go");
    if(go==="oral"){ state.tab="oral"; }
    else if(go==="verif"){ state.tab="verif"; }
    else if(go==="exam"){ state.tab="ecrit"; }
    if(go){ history.replaceState(null,"",location.pathname); render();
      if(go==="exam"){ startExamOfficiel(); } }
  }catch(e){}

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").then(function(reg){
        // Nouvelle version disponible -> on l'active et on recharge une seule fois
        reg.addEventListener("updatefound", function(){
          var nw=reg.installing;
          if(!nw) return;
          nw.addEventListener("statechange", function(){
            if(nw.state==="installed" && navigator.serviceWorker.controller){
              nw.postMessage("skipWaiting");
            }
          });
        });
      }).catch(function(){ /* hors ligne ou non supporté : l'app fonctionne quand même */ });

      var reloaded=false;
      navigator.serviceWorker.addEventListener("controllerchange", function(){
        if(reloaded) return; reloaded=true; location.reload();
      });
    });
  }
})();
</script>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StartDeck</title>
<meta name="theme-color" content="#0d1219">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230d1219'/><rect x='20' y='24' width='60' height='14' rx='5' fill='%23f5c24c'/><rect x='20' y='46' width='38' height='10' rx='4' fill='%23415066'/><rect x='20' y='64' width='50' height='10' rx='4' fill='%23415066'/></svg>">
<style>
:root{
  --accent:#f5c24c;
  --bg:#0d1219;
  --bg2:#131b25;
  --card:#161f2b;
  --card2:#1b2532;
  --line:#243040;
  --tx:#e8edf4;
  --tx2:#8b9bb0;
  --tx3:#5d6c80;
  --up:#3ddc97;
  --down:#ff6b6b;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  background:var(--bg);
  background-image:radial-gradient(1200px 600px at 15% -10%,rgba(255,255,255,.05),transparent 60%),radial-gradient(900px 500px at 90% 0%,rgba(245,194,76,.05),transparent 60%);
  background-attachment:fixed;
  color:var(--tx);
  font-family:'Space Grotesk',system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:15px;
  padding:34px clamp(16px,3vw,44px) 60px;
  -webkit-font-smoothing:antialiased;
}
body.bg-img{background-size:cover;background-position:center}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent);color:#111}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* HEADER */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap}
.hello{font-size:clamp(30px,4.4vw,52px);font-weight:700;letter-spacing:-.02em;line-height:1}
.hud{display:flex;align-items:center;gap:16px}
.weather{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 20px;min-height:64px}
.weather[hidden]{display:none}
.weather .ico{font-size:26px;line-height:1}
.weather .t{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:500;line-height:1}
.weather .c{font-size:12px;color:var(--tx2);margin-top:3px}
.clockbox{text-align:right}
.clock{font-family:'JetBrains Mono',monospace;font-size:clamp(28px,3.4vw,40px);font-weight:500;letter-spacing:.02em;line-height:1}
.date{font-size:12.5px;color:var(--tx2);margin-top:5px}
.gear{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;color:var(--tx2);transition:.2s}
.gear:hover{color:var(--accent);border-color:var(--accent);transform:rotate(35deg)}

/* SEARCH */
.searchwrap{max-width:720px;margin:38px auto 0;position:relative}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 10px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.engine{position:relative}
.engine>button{padding:8px 12px;border-radius:9px;color:var(--tx2);font-size:14px;font-weight:500;display:flex;gap:6px;align-items:center;white-space:nowrap}
.engine>button:hover{background:var(--card2);color:var(--tx)}
.search input{flex:1;background:none;border:none;outline:none;font-size:16px;padding:8px 4px;min-width:0}
.search input::placeholder{color:var(--tx3)}
.go{width:38px;height:38px;border-radius:10px;background:var(--accent);color:#14181f;display:grid;place-items:center;flex:none}
.go:hover{filter:brightness(1.1)}
.menu{position:absolute;z-index:40;top:calc(100% + 6px);left:0;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:170px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.menu button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:8px;font-size:14px;color:var(--tx2)}
.menu button:hover{background:var(--card);color:var(--tx)}
.menu button[aria-selected=true]{color:var(--accent)}
.sugg{position:absolute;z-index:35;top:calc(100% + 8px);left:0;right:0;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 20px 45px rgba(0,0,0,.5);overflow:hidden}
.sugg a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;font-size:14.5px}
.sugg a img{width:18px;height:18px;border-radius:4px}
.sugg a .u{margin-left:auto;font-size:12px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40%}
.sugg a:hover,.sugg a.sel{background:var(--card)}

/* TABS */
.tabs{display:flex;align-items:center;gap:6px;margin:34px 0 22px;flex-wrap:wrap}
.tab{padding:11px 20px;border-radius:11px;color:var(--tx2);font-weight:500;border:1px solid transparent;transition:.15s}
.tab:hover{color:var(--tx);background:var(--card)}
.tab.on{color:var(--accent);background:var(--card);border-color:rgba(245,194,76,.28)}
.tab-add{width:42px;height:42px;border-radius:11px;border:1px dashed var(--line);color:var(--tx3);display:grid;place-items:center;font-size:19px}
.tab-add:hover{color:var(--accent);border-color:var(--accent)}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:border-color .18s,box-shadow .18s}
.card:hover{border-color:#2e3c4f}
.card.drag{opacity:.35}
.card.over{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.chead{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;border-bottom:1px solid var(--line)}
.grip{color:var(--tx3);cursor:grab;font-size:14px;letter-spacing:-2px;line-height:1;padding:2px 3px}
.grip:active{cursor:grabbing}
.ctitle{font-weight:600;font-size:16px;flex:1;border-radius:6px;padding:2px 5px;margin-left:-5px;cursor:text}
.ctitle:hover{background:var(--card2)}
.ctitle[contenteditable]:focus{outline:1px solid var(--accent);background:var(--bg)}
.cact{display:flex;gap:2px;opacity:0;transition:.15s}
.card:hover .cact{opacity:1}
.iconbtn{width:28px;height:28px;border-radius:8px;color:var(--tx3);display:grid;place-items:center}
.iconbtn:hover{background:var(--card2);color:var(--tx)}
.iconbtn.danger:hover{color:var(--down)}
.cbody{padding:14px}

/* LINKS */
.lnk{display:flex;align-items:center;gap:13px;padding:9px 10px;border-radius:10px;transition:.15s}
.lnk:hover{background:var(--card2)}
.lnk img{width:22px;height:22px;border-radius:5px;flex:none;background:var(--card2)}
.lnk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnk .x{margin-left:auto;opacity:0;color:var(--tx3);padding:0 4px;font-size:16px}
.lnk:hover .x{opacity:1}
.lnk .x:hover{color:var(--down)}
.add{display:flex;align-items:center;gap:9px;width:100%;padding:12px;margin-top:6px;border:1px dashed var(--line);border-radius:11px;color:var(--tx3);font-size:14px}
.add:hover{border-color:var(--accent);color:var(--accent)}

/* NOTES */
.notes{width:100%;min-height:150px;background:none;border:none;outline:none;resize:vertical;font-size:14.5px;line-height:1.65;color:var(--tx);padding:4px}
.notes::placeholder{color:var(--tx3)}

/* TASKS */
.task{display:flex;gap:12px;align-items:flex-start;padding:9px 8px;border-radius:10px}
.task:hover{background:var(--card2)}
.task .box{width:20px;height:20px;flex:none;border:1.5px solid var(--tx3);border-radius:6px;margin-top:1px;display:grid;place-items:center;font-size:12px;color:#14181f}
.task.done .box{background:var(--accent);border-color:var(--accent)}
.task.done .txt{color:var(--tx3);text-decoration:line-through}
.task .txt{flex:1;line-height:1.45;font-size:14.5px;cursor:text;border-radius:5px;padding:0 3px}
.task .x{opacity:0;color:var(--tx3)}
.task:hover .x{opacity:1}
.newtask{width:100%;padding:12px;margin-top:6px;background:none;border:1px dashed var(--line);border-radius:11px;color:var(--tx);font-size:14px;outline:none}
.newtask::placeholder{color:var(--tx3)}
.newtask:focus{border-color:var(--accent);border-style:solid}
.count{font-size:12px;color:var(--tx3);padding:10px 4px 0}

/* MARKETS */
.row{display:flex;align-items:center;gap:12px;padding:13px 6px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .n{font-weight:600;font-size:14px;letter-spacing:.04em;flex:1}
.row .p{font-family:'JetBrains Mono',monospace;font-size:14px}
.row .d{font-family:'JetBrains Mono',monospace;font-size:13px;min-width:66px;text-align:right}
.up{color:var(--up)}.down{color:var(--down)}
.muted{color:var(--tx3);font-size:13.5px;padding:8px 4px;line-height:1.6}

/* WEATHER CARD */
.wbig{display:flex;align-items:center;gap:18px;padding:6px 4px 16px}
.wbig .i{font-size:46px}
.wbig .d{font-family:'JetBrains Mono',monospace;font-size:38px;font-weight:500}
.wdays{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;border-top:1px solid var(--line);padding-top:14px}
.wday{text-align:center;font-size:12.5px;color:var(--tx2)}
.wday .e{font-size:20px;display:block;margin:5px 0}
.wday .m{font-family:'JetBrains Mono',monospace;color:var(--tx);font-size:13px}

/* RSS */
.feed{display:block;padding:11px 8px;border-radius:9px;border-bottom:1px solid var(--line)}
.feed:last-child{border-bottom:none}
.feed:hover{background:var(--card2)}
.feed b{display:block;font-weight:500;font-size:14px;line-height:1.45}
.feed i{font-style:normal;font-size:11.5px;color:var(--tx3)}

.addcard{display:block;margin:34px auto 0;padding:13px 26px;border:1px dashed var(--line);border-radius:12px;color:var(--tx3);font-size:14px}
.addcard:hover{border-color:var(--accent);color:var(--accent)}
footer{text-align:center;color:var(--tx3);font-size:12.5px;margin-top:26px}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(6,9,13,.72);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;z-index:100}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:20px;width:min(560px,100%);max-height:86vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:22px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg2)}
.mhead h2{font-size:19px;font-weight:600}
.mbody{padding:22px 24px}
.close{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);color:var(--tx2);display:grid;place-items:center}
.close:hover{color:var(--tx);background:var(--card)}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:12px}
.type{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 10px;text-align:center;color:var(--tx2);transition:.15s}
.type:hover{border-color:var(--accent);color:var(--tx);transform:translateY(-2px)}
.type .e{font-size:26px;display:block;margin-bottom:9px}
label.f{display:block;margin-bottom:16px}
label.f span{display:block;font-size:12.5px;color:var(--tx2);margin-bottom:7px}
.in{width:100%;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 14px;outline:none;font-size:15px}
.in:focus{border-color:var(--accent)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:10px;border:2px solid transparent}
.sw[aria-pressed=true]{border-color:#fff}
.btns{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.btn{padding:11px 18px;border-radius:11px;border:1px solid var(--line);color:var(--tx2);font-size:14px}
.btn:hover{color:var(--tx);background:var(--card)}
.btn.pri{background:var(--accent);color:#14181f;border-color:var(--accent);font-weight:600}
.btn.pri:hover{filter:brightness(1.08);background:var(--accent)}
.sep{height:1px;background:var(--line);margin:22px 0}
.hint{font-size:12.5px;color:var(--tx3);line-height:1.6;margin-top:8px}
@media(max-width:640px){
  body{padding:20px 14px 46px}
  .top{gap:14px}
  .hud{width:100%;justify-content:space-between}
  .tabs{margin:26px 0 18px}
  .grid{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top">
  <h1 class="hello" id="hello">Bonjour</h1>
  <div class="hud">
    <div class="weather" id="wnow" hidden><div class="ico" id="wico">☁️</div><div><div class="t" id="wtemp">—</div><div class="c" id="wcity">—</div></div></div>
    <div class="clockbox"><div class="clock" id="clock">--:--</div><div class="date" id="date"></div></div>
    <button class="gear" id="btnSettings" title="Réglages" aria-label="Réglages">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</header>

<div class="searchwrap">
  <div class="search">
    <div class="engine">
      <button id="btnEngine" aria-haspopup="true"><span id="engineName">Google</span> <span style="font-size:9px">▼</span></button>
    </div>
    <input id="q" placeholder="Rechercher sur le web ou dans vos favoris..." autocomplete="off" spellcheck="false">
    <button class="go" id="btnGo" aria-label="Rechercher">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </button>
  </div>
</div>

<nav class="tabs" id="tabs"></nav>
<main class="grid" id="grid"></main>
<button class="addcard" id="btnAddCard">+ Ajouter une carte</button>
<footer>StartDeck · votre page de démarrage, hébergée par vous. Données stockées localement dans ce navigateur.</footer>

<script>
const KEY='startdeck.v1';
const ENGINES={
  google:['Google','https://www.google.com/search?q='],
  ddg:['DuckDuckGo','https://duckduckgo.com/?q='],
  bing:['Bing','https://www.bing.com/search?q='],
  perplexity:['Perplexity','https://www.perplexity.ai/search?q='],
  youtube:['YouTube','https://www.youtube.com/results?search_query='],
  github:['GitHub','https://github.com/search?q='],
  tv:['TradingView','https://www.tradingview.com/symbols/']
};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const host=u=>{try{return new URL(u).hostname}catch(e){return''}};
const fav=u=>'https://www.google.com/s2/favicons?domain='+host(u)+'&sz=64';

function seed(){
  return{
    settings:{name:'',city:'Paris',engine:'google',accent:'#f5c24c',bg:''},
    active:0,
    tabs:[
      {id:uid(),name:'Trading',cards:[
        {id:uid(),type:'links',title:'Plateformes',items:[
          {t:'TradingView',u:'https://www.tradingview.com/chart/'},
          {t:'Sierra Chart',u:'https://www.sierrachart.com/'},
          {t:'Apex Trader Funding',u:'https://apextraderfunding.com/member/aff/go/mickaelb?c=APYDLXXD'},
          {t:'Rithmic',u:'https://www.rithmic.com/'}]},
        {id:uid(),type:'links',title:'Ressources',items:[
          {t:'Investing.com Agenda',u:'https://fr.investing.com/economic-calendar/'},
          {t:'ForexFactory',u:'https://www.forexfactory.com/calendar'},
          {t:'Finviz',u:'https://finviz.com/futures.ashx'}]},
        {id:uid(),type:'notes',title:'Plan de trading',text:"Biais avant tout.\nA = confluence totale (full size)\nB = 1 signal manquant (half)\nC = structure seule (quarter)\n\nEntrée : pullback VWAP / bord de range + 2-3 imbalances empilées + absorption + delta flip.\nStop 1-2 ticks au-delà de l'absorption, jamais élargi.\nPartiel à +1R, trail après +1.5R, runner vers PDH/PDL ou LVN.\n\nNo-trade : chop dans la VA de la veille, VWAP entremêlés, news ±2 min.\nMax 3 stops → pause 30 min. Après +2R, taille -50%."},
        {id:uid(),type:'markets',title:'Marchés',coins:['bitcoin','ethereum','solana']}
      ]},
      {id:uid(),name:'Web',cards:[
        {id:uid(),type:'links',title:'Dev',items:[
          {t:'GitHub',u:'https://github.com/mickael-fr'},
          {t:'MDN Web Docs',u:'https://developer.mozilla.org/fr/'},
          {t:'Stack Overflow',u:'https://stackoverflow.com/'},
          {t:'CodePen',u:'https://codepen.io/'}]},
        {id:uid(),type:'links',title:'Clients & régie',items:[
          {t:'valentine-mathieu.fr',u:'https://valentine-mathieu.fr'},
          {t:'Google Ads',u:'https://ads.google.com/'},
          {t:'Google Analytics',u:'https://analytics.google.com/'},
          {t:'OVH Manager',u:'https://www.ovh.com/manager/'},
          {t:'Search Console',u:'https://search.google.com/search-console'}]},
        {id:uid(),type:'tasks',title:'À faire',items:[
          {t:'Publier balayage.php + créer le groupe « Balayage »',d:false},
          {t:'Construire single-atbdp_listing.php (fromages.fr)',d:false},
          {t:'Faire un export JSON de sauvegarde',d:false}]},
        {id:uid(),type:'notes',title:'Notes',text:''}
      ]},
      {id:uid(),name:'Perso',cards:[
        {id:uid(),type:'links',title:'Quotidien',items:[
          {t:'Gmail',u:'https://mail.google.com/'},
          {t:'Google Agenda',u:'https://calendar.google.com/'},
          {t:'Google Drive',u:'https://drive.google.com/'},
          {t:'YouTube',u:'https://www.youtube.com/'}]},
        {id:uid(),type:'links',title:'Permis C',items:[
          {t:'Révision Permis C',u:'https://mickael-fr.github.io/permis-c/'},
          {t:'PROMOTRANS',u:'https://www.promotrans.fr/'}]},
        {id:uid(),type:'weather',title:'Météo',city:'Paris'}
      ]}
    ]
  };
}

let S;
try{S=JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){S=seed()}
if(!S.tabs||!S.tabs.length)S=seed();
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const tab=()=>S.tabs[Math.min(S.active,S.tabs.length-1)];
const card=id=>tab().cards.find(c=>c.id===id);

/* ---------- header ---------- */
function tick(){
  const d=new Date();
  clock.textContent=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  const cap=x=>x.charAt(0).toUpperCase()+x.slice(1);
  date.textContent=cap(d.toLocaleDateString('fr-FR',{weekday:'long'}))+' '+d.getDate()+' '+cap(d.toLocaleDateString('fr-FR',{month:'long'}));
  const h=d.getHours();
  const g=h<7?'Bonne nuit':h<12?'Bonjour':h<18?'Bon après-midi':'Bonsoir';
  hello.textContent=S.settings.name?g+', '+S.settings.name:g;
}
setInterval(tick,10000);

function applyTheme(){
  document.documentElement.style.setProperty('--accent',S.settings.accent||'#f5c24c');
  const bg=(S.settings.bg||'').trim();
  if(bg){document.body.classList.add('bg-img');document.body.style.backgroundImage='linear-gradient(rgba(8,11,16,.72),rgba(8,11,16,.82)),url("'+bg+'")'}
  else{document.body.classList.remove('bg-img');document.body.style.backgroundImage=''}
}

/* ---------- weather ---------- */
const WICON={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌦️',61:'🌧️',63:'🌧️',65:'🌧️',66:'🌧️',67:'🌧️',71:'🌨️',73:'🌨️',75:'❄️',77:'❄️',80:'🌦️',81:'🌧️',82:'⛈️',85:'🌨️',86:'❄️',95:'⛈️',96:'⛈️',99:'⛈️'};
const wcache={};
async function weather(city){
  city=city||'Paris';
  if(wcache[city]&&Date.now()-wcache[city].at<9e5)return wcache[city].d;
  const g=await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=fr&name='+encodeURIComponent(city)).then(r=>r.json());
  if(!g.results||!g.results.length)throw new Error('Ville introuvable');
  const p=g.results[0];
  const w=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=5`).then(r=>r.json());
  const d={name:p.name,cur:Math.round(w.current.temperature_2m),code:w.current.weather_code,daily:w.daily};
  wcache[city]={at:Date.now(),d};
  return d;
}
async function headerWeather(){
  try{
    const d=await weather(S.settings.city);
    wico.textContent=WICON[d.code]||'☁️';
    wtemp.textContent=d.cur+'°';
    wcity.textContent=d.name;
    wnow.hidden=false;
  }catch(e){wnow.hidden=true}
}

/* ---------- tabs ---------- */
function renderTabs(){
  tabs.innerHTML='';
  S.tabs.forEach((t,i)=>{
    const b=document.createElement('button');
    b.className='tab'+(i===S.active?' on':'');
    b.textContent=t.name;
    b.title='Double-clic pour renommer';
    b.onclick=()=>{S.active=i;save();render()};
    b.ondblclick=()=>{
      const n=prompt('Nom de l\'onglet',t.name);
      if(n===null)return;
      if(!n.trim()){if(S.tabs.length>1&&confirm('Supprimer l\'onglet « '+t.name+' » ?')){S.tabs.splice(i,1);S.active=0}}
      else t.name=n.trim();
      save();render();
    };
    tabs.appendChild(b);
  });
  const a=document.createElement('button');
  a.className='tab-add';a.textContent='+';a.title='Nouvel onglet';
  a.onclick=()=>{const n=prompt('Nom du nouvel onglet','Nouveau');if(!n)return;S.tabs.push({id:uid(),name:n,cards:[]});S.active=S.tabs.length-1;save();render()};
  tabs.appendChild(a);
}

/* ---------- cards ---------- */
function shell(c,extra){
  const el=document.createElement('section');
  el.className='card';el.dataset.id=c.id;
  el.innerHTML=`<div class="chead">
    <span class="grip" title="Glisser pour déplacer">⠿</span>
    <div class="ctitle" data-t>${esc(c.title)}</div>
    <div class="cact">${extra||''}<button class="iconbtn danger" data-del title="Supprimer la carte">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button></div>
  </div><div class="cbody"></div>`;
  const t=el.querySelector('[data-t]');
  t.onclick=()=>{t.contentEditable='true';t.focus();document.execCommand&&document.getSelection().selectAllChildren(t)};
  t.onblur=()=>{t.contentEditable='false';c.title=t.textContent.trim()||'Sans titre';t.textContent=c.title;save()};
  t.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();t.blur()}};
  el.querySelector('[data-del]').onclick=()=>{if(!confirm('Supprimer « '+c.title+' » ?'))return;tab().cards=tab().cards.filter(x=>x.id!==c.id);save();render()};
  const g=el.querySelector('.grip');
  g.onmousedown=()=>el.draggable=true;
  g.ontouchstart=()=>el.draggable=true;
  el.addEventListener('dragstart',e=>{drag=c.id;el.classList.add('drag');e.dataTransfer.effectAllowed='move'});
  el.addEventListener('dragend',()=>{el.draggable=false;el.classList.remove('drag');document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'))});
  el.addEventListener('dragover',e=>{e.preventDefault();if(drag&&drag!==c.id)el.classList.add('over')});
  el.addEventListener('dragleave',()=>el.classList.remove('over'));
  el.addEventListener('drop',e=>{
    e.preventDefault();el.classList.remove('over');
    const cs=tab().cards,from=cs.findIndex(x=>x.id===drag),to=cs.findIndex(x=>x.id===c.id);
    if(from<0||to<0||from===to)return;
    cs.splice(to,0,cs.splice(from,1)[0]);save();render();
  });
  return el;
}
let drag=null;

function renderLinks(c,body){
  c.items=c.items||[];
  c.items.forEach((it,i)=>{
    const a=document.createElement('a');
    a.className='lnk';a.href=it.u;a.rel='noreferrer';
    a.innerHTML=`<img src="${esc(fav(it.u))}" alt="" loading="lazy"><span>${esc(it.t)}</span><button class="x" title="Retirer">×</button>`;
    a.querySelector('.x').onclick=e=>{e.preventDefault();c.items.splice(i,1);save();render()};
    body.appendChild(a);
  });
  const b=document.createElement('button');
  b.className='add';b.innerHTML='<span>+</span> Ajouter un lien';
  b.onclick=()=>linkModal(c);
  body.appendChild(b);
}

function renderNotes(c,body){
  const t=document.createElement('textarea');
  t.className='notes';t.placeholder='Écrivez ici...';t.value=c.text||'';
  let h;
  t.oninput=()=>{clearTimeout(h);h=setTimeout(()=>{c.text=t.value;save()},400)};
  t.onblur=()=>{c.text=t.value;save()};
  body.appendChild(t);
  const grow=()=>{t.style.height='auto';t.style.height=Math.max(150,t.scrollHeight+4)+'px'};
  t.addEventListener('input',grow);
  requestAnimationFrame(grow);
}

function renderTasks(c,body){
  c.items=c.items||[];
  c.items.forEach((it,i)=>{
    const r=document.createElement('div');
    r.className='task'+(it.d?' done':'');
    r.innerHTML=`<button class="box">${it.d?'✓':''}</button><div class="txt">${esc(it.t)}</div><button class="x iconbtn" title="Retirer">×</button>`;
    r.querySelector('.box').onclick=()=>{it.d=!it.d;save();render()};
    r.querySelector('.x').onclick=()=>{c.items.splice(i,1);save();render()};
    const tx=r.querySelector('.txt');
    tx.onclick=()=>{tx.contentEditable='true';tx.focus()};
    tx.onblur=()=>{tx.contentEditable='false';const v=tx.textContent.trim();if(v)it.t=v;else c.items.splice(i,1);save();render()};
    tx.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();tx.blur()}};
    body.appendChild(r);
  });
  const inp=document.createElement('input');
  inp.className='newtask';inp.placeholder='+ Nouvelle tâche... (Entrée)';
  inp.onkeydown=e=>{if(e.key==='Enter'&&inp.value.trim()){c.items.push({t:inp.value.trim(),d:false});save();render()}};
  body.appendChild(inp);
  const n=c.items.filter(x=>!x.d).length;
  const p=document.createElement('div');p.className='count';
  p.textContent=n?n+' restante'+(n>1?'s':''):'Tout est fait 🎉';
  body.appendChild(p);
}

async function renderWeather(c,body){
  body.innerHTML='<div class="muted">Chargement…</div>';
  try{
    const d=await weather(c.city||S.settings.city);
    const days=d.daily.time.slice(1,5).map((t,i)=>{
      const n=new Date(t).toLocaleDateString('fr-FR',{weekday:'short'});
      return `<div class="wday">${esc(n)}<span class="e">${WICON[d.daily.weather_code[i+1]]||'☁️'}</span><span class="m">${Math.round(d.daily.temperature_2m_max[i+1])}° / ${Math.round(d.daily.temperature_2m_min[i+1])}°</span></div>`;
    }).join('');
    body.innerHTML=`<div class="wbig"><div class="i">${WICON[d.code]||'☁️'}</div><div><div class="d">${d.cur}°</div><div class="muted" style="padding:0">${esc(d.name)}</div></div></div><div class="wdays">${days}</div>`;
  }catch(e){body.innerHTML='<div class="muted">Météo indisponible. Vérifiez la ville dans les réglages de la carte (icône ⚙ au survol).</div>'}
}

async function renderMarkets(c,body){
  body.innerHTML='<div class="muted">Chargement…</div>';
  const ids=(c.coins&&c.coins.length?c.coins:['bitcoin','ethereum','solana']);
  try{
    const r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids='+ids.join(',')+'&vs_currencies=eur&include_24hr_change=true').then(x=>x.json());
    body.innerHTML=ids.map(id=>{
      const d=r[id];if(!d)return'';
      const ch=d.eur_24h_change||0;
      return `<div class="row"><span class="n">${esc(id.toUpperCase())}</span><span class="p">${d.eur.toLocaleString('fr-FR',{maximumFractionDigits:d.eur<10?4:2})} €</span><span class="d ${ch>=0?'up':'down'}">${ch>=0?'+':''}${ch.toFixed(2)}%</span></div>`;
    }).join('')||'<div class="muted">Aucune donnée.</div>';
  }catch(e){body.innerHTML='<div class="muted">Cours indisponibles (limite de l\'API atteinte). Réessayez dans une minute.</div>'}
}

async function renderRss(c,body){
  body.innerHTML='<div class="muted">Chargement…</div>';
  if(!c.url){body.innerHTML='<div class="muted">Aucun flux configuré. Survolez la carte et cliquez sur ⚙ pour ajouter une URL RSS.</div>';return}
  try{
    const txt=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(c.url)).then(r=>r.text());
    const doc=new DOMParser().parseFromString(txt,'text/xml');
    const items=[...doc.querySelectorAll('item,entry')].slice(0,7);
    if(!items.length)throw 0;
    body.innerHTML=items.map(it=>{
      const t=it.querySelector('title')?.textContent||'';
      const l=it.querySelector('link')?.getAttribute('href')||it.querySelector('link')?.textContent||'#';
      const d=it.querySelector('pubDate,updated')?.textContent||'';
      return `<a class="feed" href="${esc(l)}" rel="noreferrer"><b>${esc(t)}</b><i>${d?esc(new Date(d).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})):''}</i></a>`;
    }).join('');
  }catch(e){body.innerHTML='<div class="muted">Flux illisible. Vérifiez l\'URL du RSS.</div>'}
}

const REFRESH='<button class="iconbtn" data-refresh title="Rafraîchir"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg></button>';
const CFG='<button class="iconbtn" data-cfg title="Configurer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="2.6"/><path d="M4 12h3M17 12h3M12 4v3M12 17v3"/></svg></button>';

function render(){
  renderTabs();
  grid.innerHTML='';
  const cs=tab().cards;
  if(!cs.length){
    grid.innerHTML='<div class="muted" style="grid-column:1/-1;text-align:center;padding:50px 0">Cet onglet est vide. Ajoutez une carte ci-dessous.</div>';
  }
  cs.forEach(c=>{
    const dyn=(c.type==='markets'||c.type==='rss'||c.type==='weather');
    const el=shell(c,(dyn?REFRESH:'')+((c.type==='weather'||c.type==='rss'||c.type==='markets')?CFG:''));
    const body=el.querySelector('.cbody');
    if(c.type==='links')renderLinks(c,body);
    else if(c.type==='notes')renderNotes(c,body);
    else if(c.type==='tasks')renderTasks(c,body);
    else if(c.type==='weather')renderWeather(c,body);
    else if(c.type==='markets')renderMarkets(c,body);
    else if(c.type==='rss')renderRss(c,body);
    const rf=el.querySelector('[data-refresh]');
    if(rf)rf.onclick=()=>{if(c.type==='weather'){delete wcache[c.city||S.settings.city];renderWeather(c,body)}else if(c.type==='markets')renderMarkets(c,body);else renderRss(c,body)};
    const cf=el.querySelector('[data-cfg]');
    if(cf)cf.onclick=()=>{
      if(c.type==='weather'){const v=prompt('Ville',c.city||S.settings.city);if(v){c.city=v.trim();save();renderWeather(c,body)}}
      else if(c.type==='rss'){const v=prompt('URL du flux RSS',c.url||'https://www.lemonde.fr/rss/une.xml');if(v){c.url=v.trim();save();renderRss(c,body)}}
      else{const v=prompt('Identifiants CoinGecko séparés par des virgules',(c.coins||[]).join(','));if(v){c.coins=v.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);save();renderMarkets(c,body)}}
    };
    grid.appendChild(el);
  });
  tick();
}

/* ---------- modals ---------- */
function modal(title,html){
  const o=document.createElement('div');
  o.className='overlay';
  o.innerHTML=`<div class="modal"><div class="mhead"><h2>${esc(title)}</h2><button class="close">×</button></div><div class="mbody">${html}</div></div>`;
  o.onclick=e=>{if(e.target===o)o.remove()};
  o.querySelector('.close').onclick=()=>o.remove();
  document.addEventListener('keydown',function k(e){if(e.key==='Escape'){o.remove();document.removeEventListener('keydown',k)}});
  document.body.appendChild(o);
  return o;
}

function linkModal(c){
  const o=modal('Ajouter un lien',`
    <label class="f"><span>Adresse</span><input class="in" id="lu" placeholder="exemple.fr" autofocus></label>
    <label class="f"><span>Nom</span><input class="in" id="lt" placeholder="Laisser vide pour utiliser le domaine"></label>
    <div class="btns"><button class="btn" data-c>Annuler</button><button class="btn pri" id="lok">Ajouter</button></div>`);
  const lu=o.querySelector('#lu'),lt=o.querySelector('#lt');
  o.querySelector('[data-c]').onclick=()=>o.remove();
  const ok=()=>{
    let u=lu.value.trim();if(!u)return;
    if(!/^https?:\/\//i.test(u))u='https://'+u;
    c.items=c.items||[];
    c.items.push({t:lt.value.trim()||host(u).replace(/^www\./,''),u});
    save();o.remove();render();
  };
  o.querySelector('#lok').onclick=ok;
  [lu,lt].forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')ok()});
  lu.focus();
}

const TYPES=[
  ['links','🔖','Favoris'],['notes','📝','Notes'],['tasks','✅','Tâches'],
  ['weather','🌤️','Météo'],['markets','💰','Marchés'],['rss','📰','Actualités RSS']
];
btnAddCard.onclick=()=>{

btnSettings.onclick=()=>{
  const s=S.settings;

  const o=modal('Réglages',`

    <label class="f" style="margin-top:20px"><span>Image d'arrière-plan (URL, vide pour le fond sombre)</span><input class="in" id="sb" value="${esc(s.bg||'')}" placeholder="https://…"></label>

      <button class="btn" id="imp">Importer un JSON</button>

    </div>
    <p class="hint">L'import de favoris accepte le fichier <b>.html</b> exporté depuis Chrome, Firefox, Edge ou Safari. Chaque dossier devient une carte dans l'onglet courant.</p>
    <div class="sep"></div>
    <div class="btns"><button class="btn" id="reset">Tout réinitialiser</button><button class="btn pri" id="ok">Enregistrer</button></div>`);
  let acc=s.accent;
  o.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{acc=b.dataset.col;o.querySelectorAll('.sw').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  o.querySelector('#ok').onclick=()=>{
    s.name=o.querySelector('#sn').value.trim();
    s.city=o.querySelector('#sc').value.trim()||'Paris';
    s.engine=o.querySelector('#se').value;

    save();applyTheme();engineName.textContent=ENGINES[s.engine][0];headerWeather();o.remove();render();
  };
  o.querySelector('#exp').onclick=()=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));
    a.download='startdeck-'+new Date().toISOString().slice(0,10)+'.json';a.click();
  };
  o.querySelector('#imp').onclick=()=>pick('.json',f=>{

    r.readAsText(f);
  });
  o.querySelector('#impb').onclick=()=>pick('.html,.htm',f=>{
    const r=new FileReader();

      const doc=new DOMParser().parseFromString(r.result,'text/html');
      const groups=[];
      doc.querySelectorAll('h3').forEach(h=>{
        const dl=h.nextElementSibling;
        if(!dl||dl.tagName!=='DL')return;
        const items=[...dl.querySelectorAll(':scope > dt > a')].slice(0,40).map(a=>({t:a.textContent.trim()||host(a.href),u:a.href})).filter(x=>/^https?:/.test(x.u));
        if(items.length)groups.push({id:uid(),type:'links',title:h.textContent.trim()||'Favoris',items});
      });
      if(!groups.length){
        const items=[...doc.querySelectorAll('a')].map(a=>({t:a.textContent.trim()||host(a.href),u:a.href})).filter(x=>/^https?:/.test(x.u)).slice(0,40);
        if(items.length)groups.push({id:uid(),type:'links',title:'Favoris importés',items});

      if(!groups.length){alert('Aucun favori trouvé dans ce fichier.');return}
      tab().cards.push(...groups);save();o.remove();render();

function pick(accept,cb){
  const i=document.createElement('input');
  i.type='file';i.accept=accept;
  i.onchange=()=>{if(i.files[0])cb(i.files[0])};
  i.click();
}

/* ---------- search ---------- */
let sugIdx=-1;
engineName.textContent=ENGINES[S.settings.engine]?ENGINES[S.settings.engine][0]:'Google';
btnEngine.onclick=e=>{
  e.stopPropagation();
  const old=document.querySelector('.menu');if(old){old.remove();return}

  m.innerHTML=Object.entries(ENGINES).map(([k,v])=>`<button data-k="${k}" aria-selected="${k===S.settings.engine}">${v[0]}</button>`).join('');
  m.querySelectorAll('button').forEach(b=>b.onclick=()=>{S.settings.engine=b.dataset.k;save();engineName.textContent=ENGINES[b.dataset.k][0];m.remove();q.focus()});

};
document.addEventListener('click',()=>{const m=document.querySelector('.menu');if(m)m.remove()});

function allLinks(){
  const out=[];
  S.tabs.forEach(t=>t.cards.forEach(c=>{if(c.type==='links')(c.items||[]).forEach(i=>out.push({...i,tab:t.name}))}));
  return out;
}
function suggest(){
  document.querySelector('.sugg')?.remove();
  sugIdx=-1;
  const v=q.value.trim().toLowerCase();
  if(!v)return;
  const hits=allLinks().filter(l=>l.t.toLowerCase().includes(v)||l.u.toLowerCase().includes(v)).slice(0,6);
  if(!hits.length)return;
  const d=document.createElement('div');d.className='sugg';
  d.innerHTML=hits.map(h=>`<a href="${esc(h.u)}"><img src="${esc(fav(h.u))}" alt=""><span>${esc(h.t)}</span><span class="u">${esc(h.tab)}</span></a>`).join('');
  document.querySelector('.searchwrap').appendChild(d);
}
function runSearch(){
  const sel=document.querySelector('.sugg a.sel');
  if(sel){location.href=sel.href;return}
  const v=q.value.trim();if(!v)return;
  if(/^(https?:\/\/|[\w-]+\.[a-z]{2,}(\/|$))/i.test(v)){location.href=/^https?:/i.test(v)?v:'https://'+v;return}
  location.href=ENGINES[S.settings.engine][1]+encodeURIComponent(v);
}
q.addEventListener('input',suggest);
q.addEventListener('keydown',e=>{
  const items=[...document.querySelectorAll('.sugg a')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    if(!items.length)return;
    e.preventDefault();
    sugIdx=(sugIdx+(e.key==='ArrowDown'?1:-1)+items.length+1)%(items.length+1);
    items.forEach(a=>a.classList.remove('sel'));
    if(sugIdx<items.length)items[sugIdx].classList.add('sel');
  }
  else if(e.key==='Enter')runSearch();
  else if(e.key==='Escape'){q.value='';suggest();q.blur()}
});
q.addEventListener('blur',()=>setTimeout(()=>document.querySelector('.sugg')?.remove(),180));
btnGo.onclick=runSearch;
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,[contenteditable=true]'))return;
  if(e.key==='/'||(e.key==='k'&&(e.metaKey||e.ctrlKey))){e.preventDefault();q.focus()}
});

/* ---------- go ---------- */
applyTheme();
render();
tick();
headerWeather();
</script>
</body>
</html>
